# ── ANDYFITZGERALDCONSULTING.COM — PREVIEW HOST ─────────────────────────────
#
# Authored here and deployed; never edited on the server (decided 2026-08-20).
# Deploys to `/etc/nginx/conf.d/afc.conf`, which nginx includes at `http` level —
# required, because `limit_req_zone` below is an http-context directive.
#
# The two snippets it pulls in are the opposite: both hold server-context
# directives and must live in `snippets/`, NOT in `conf.d/`, or nginx will try to
# load them at http level and fail.
#
#   /etc/nginx/conf.d/afc.conf              this file
#   /etc/nginx/snippets/afc-common.conf     site-common.conf
#   /etc/nginx/snippets/afc-redirects.conf  redirects.conf
#
# ── WHY PRODUCTION IS IN A SEPARATE FILE ───────────────────────────────────
#
# This file originally carried all four server blocks, apex included, on the
# reasoning that cutover should be a DNS change rather than a newly authored
# config. MEASURED ON THE DROPLET 2026-09-20, that would have taken the live site
# down the moment it was installed:
#
#   `/etc/nginx/sites-available/andyfitzgeraldconsulting.com` already declares
#   `server_name andyfitzgeraldconsulting.com www.andyfitzgeraldconsulting.com`
#   on `listen 443`. nginx.conf includes `conf.d/` (line 59) BEFORE
#   `sites-enabled/` (line 60), so this file would have loaded first and won —
#   serving the apex from `/var/www/afc/html/public`, which does not exist under
#   the current 11ty release layout.
#
# nginx treats a duplicate server_name as a WARNING (`conflicting server name …
# ignored`), not an error, so `nginx -t` passes and the failure arrives at reload.
#
# The production blocks therefore live in `afc-production.conf`, which is NOT
# deployed until cutover — at which point the old sites-enabled file is removed in
# the same change. Commenting them out in place was the alternative and was
# rejected: commented-out config rots, and someone eventually uncomments it
# without re-checking the condition that made it unsafe.


# ── RATE LIMITING ───────────────────────────────────────────────────────────
#
# Declared here because `limit_req_zone` is only valid at http level; the `limit_req`
# that uses it sits in the contact location in afc-common.conf. It stays in THIS
# file rather than moving to afc-production.conf, because a zone must be declared
# exactly once and this is the file that is always present.
#
# 10 requests per minute per IP, with a burst of 5 taken immediately. The burst is
# the number that matters, and it is sized for the CORRECTION LOOP rather than for
# a single submission — see the note beside `limit_req` in afc-common.conf, where
# a server-side 422 is shown to cost a request just as a real send does.
#
# 10m of shared memory tracks roughly 160,000 addresses, which is more than this
# site will ever need — the minimum practical size, not a considered capacity
# figure.
#
# ── $binary_remote_addr IS WRONG BEHIND CLOUDFLARE, AND THE APEX IS ────────
#
# Measured 2026-09-20: `preview.` resolves straight to the droplet, but the apex
# resolves to `2606:4700:…` — Cloudflare. So on the apex every visitor arrives as
# one of a handful of Cloudflare addresses, and a per-IP limit becomes a per-SITE
# limit shared by everyone. Five people filling in the contact form in the same
# minute would throttle each other.
#
# Not a problem today, because only `preview.` is served from here and it is not
# proxied. It MUST be fixed before the apex moves: set `real_ip_header
# CF-Connecting-IP` with `set_real_ip_from` covering Cloudflare's published
# ranges, so `$binary_remote_addr` is the visitor again. See afc-production.conf.
limit_req_zone $binary_remote_addr zone=afc_contact:10m rate=10r/m;


# ── PORT 80: ACME, THEN HTTPS ───────────────────────────────────────────────
#
# `preview.` only. The apex and www keep their port-80 handling in the existing
# sites-enabled config until cutover, and picking up those names here would
# conflict with it exactly as the 443 block would.
server {
  listen 80;
  listen [::]:80;
  server_name preview.andyfitzgeraldconsulting.com;

  # Certificates are issued with `certbot certonly --webroot`, NOT `certbot --nginx`.
  # The installer plugin edits server blocks in place, which would write changes into
  # a file that is supposed to be deployed rather than edited — the exact thing the
  # repo-authored approach exists to prevent. `certonly` leaves this file alone and
  # only drops files under the webroot below.
  #
  # This location is why the bootstrap block used to obtain the first certificate
  # can be deleted: renewals land here instead.
  #
  # `^~` so this wins over the redirect regardless of what follows it.
  location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
    default_type "text/plain";
  }

  location / {
    return 301 https://$host$request_uri;
  }
}


# ── PREVIEW / STAGING ───────────────────────────────────────────────────────
#
# Serving the STATIC production-mode build during the pre-launch rehearsal, and
# flipping to SSR afterwards to deliver live visual editing. Named for the
# permanent job rather than the temporary one (Andy, 2026-09-18).
#
# One consequence worth stating plainly, because it looks like a bug: this build
# carries `site: https://andyfitzgeraldconsulting.com`, so its canonical links,
# JSON-LD @ids, sitemap and feed URLs all point at the APEX. That is the price of
# rehearsing the exact artifact that will ship, and it is also protective — a
# crawler that ignored everything below would still be told the canonical copy is
# elsewhere.
#
# ── WHEN THIS FLIPS TO SSR, THREE THINGS CHANGE ────────────────────────────
#
# Recorded now because each is cheap to decide in advance and expensive to
# discover at the time.
#
# 1. PORT 8081. The `location /` below becomes `proxy_pass http://127.0.0.1:8081`.
#
#       8080  preview.uxmethods.org   (taken — uxmethods' PM2 process)
#       8081  preview.andyfitzgeraldconsulting.com   RESERVED HERE
#
#    Two Astro SSR apps on one droplet, so the port map is the thing that stops
#    them silently fighting. Whichever bound first would win and the other would
#    fail to start — obvious in advance, baffling at 2am.
#
# 2. `proxy_set_header X-Forwarded-Proto $scheme;` — and it is not optional.
#    nginx terminates TLS and proxies over plain HTTP to localhost, so without
#    this the app computes `http` for its own scheme and emits `http://` in every
#    absolute URL it derives from the request: canonicals, redirects, form
#    actions, OG image URLs. Mixed-content warnings and extra redirect hops, from
#    one missing line. `preview.uxmethods.org` is missing it today.
#    The full set is Host, X-Real-IP, X-Forwarded-For and X-Forwarded-Proto.
#
# 3. The static-file locations in afc-common.conf stop applying. Under SSR, Astro
#    serves its own `_astro/` assets, so the cache tiers, the feed content-type
#    and the `try_files` all move behind the proxy — this block would include the
#    contact location and the redirects, but not the rest. Worth planning as a
#    split of that snippet rather than an edit to it.
server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name preview.andyfitzgeraldconsulting.com;

  ssl_certificate     /etc/letsencrypt/live/preview.andyfitzgeraldconsulting.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/preview.andyfitzgeraldconsulting.com/privkey.pem;
  include             /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

  # ── KEEPING IT OUT OF THE INDEX — NO BASIC AUTH, BY DECISION ────────────
  #
  # `robots.txt.ts` anticipated basic auth here, and phase 6 originally shipped it.
  # ANDY'S CALL, 2026-09-20: no auth. Nothing on the draft site is sensitive, Sanity's
  # visual editing is more streamlined without a credential in front of it, and the
  # cutover is complicated enough without added friction.
  #
  # So `X-Robots-Tag` is now the ONLY control, not the belt to a pair of braces —
  # which raises what it has to carry. It is set per location in afc-common.conf
  # rather than once here, because nginx replaces the inherited `add_header` set
  # whenever a location declares its own; a server-level header would be dropped
  # from every page that matched one. Verify it is present on a real page after any
  # change to that file, not just on `/`.
  #
  # Two things still point away from this host, and they are what make one control
  # adequate rather than thin. The build runs in PRODUCTION mode, so every canonical
  # link, JSON-LD `@id` and feed URL names the apex. And `robots.txt` omits its
  # `Sitemap:` line under preview, so nothing invites a crawl in the first place.
  #
  # What was given up: a crawler that ignores `X-Robots-Tag` now reaches content
  # where before it got a 401. That is the accepted trade, and `Disallow: /` is NOT
  # the fix — it blocks crawling rather than indexing, so it would stop a crawler
  # reading the very header telling it to stay out.
  set $afc_robots "noindex, nofollow";

  # ── THE RELEASE LAYOUT, WHICH THE DEPLOY WORKFLOW MUST MATCH ────────────
  #
  # A release is TWO directories, not one:
  #
  #   /var/www/afc-preview/html -> releases/<ts>/
  #                                  public/   the Astro build — this is the web root
  #                                  server/   contact.php, vendor/, .env — never served
  #
  # This differs from build-prod.yml, where the release directory IS the web root
  # and mailhandler.php sits inside it. The split is what lets contact.php keep the
  # promise in its own header comment — that the `.env` beside it is somewhere
  # nginx does not serve — and it is the structural half of the fix for the live
  # site's world-readable `.env`. The permissions half belongs to the workflow.
  #
  # Both paths go through the `html` symlink so a deploy swaps them together.
  root /var/www/afc-preview/html/public;
  set $afc_php /var/www/afc-preview/html/server;

  include /etc/nginx/snippets/afc-redirects.conf;
  include /etc/nginx/snippets/afc-common.conf;
}
