# ── ANDYFITZGERALDCONSULTING.COM — PREVIEW HOST ─────────────────────────────
#
# Authored here and deployed; never edited on the server (decided 2026-08-20).
# Deploys to `/etc/nginx/conf.d/afc.conf`, which nginx includes at `http` level —
# required, because `limit_req_zone` below is an http-context directive.
#
# The two snippets it pulls in are the opposite: both hold server-context
# directives and must live in `snippets/`, NOT in `conf.d/`, or nginx will try to
# load them at http level and fail.
#
#   /etc/nginx/conf.d/afc.conf              this file
#   /etc/nginx/snippets/afc-common.conf     site-common.conf
#   /etc/nginx/snippets/afc-redirects.conf  redirects.conf
#
# ── WHY PRODUCTION IS IN A SEPARATE FILE ───────────────────────────────────
#
# This file originally carried all four server blocks, apex included, on the
# reasoning that cutover should be a DNS change rather than a newly authored
# config. MEASURED ON THE DROPLET 2026-09-20, that would have taken the live site
# down the moment it was installed:
#
#   `/etc/nginx/sites-available/andyfitzgeraldconsulting.com` already declares
#   `server_name andyfitzgeraldconsulting.com www.andyfitzgeraldconsulting.com`
#   on `listen 443`. nginx.conf includes `conf.d/` (line 59) BEFORE
#   `sites-enabled/` (line 60), so this file would have loaded first and won —
#   serving the apex from `/var/www/afc/html/public`, which does not exist under
#   the current 11ty release layout.
#
# nginx treats a duplicate server_name as a WARNING (`conflicting server name …
# ignored`), not an error, so `nginx -t` passes and the failure arrives at reload.
#
# The production blocks therefore live in `afc-production.conf`, which is NOT
# deployed until cutover — at which point the old sites-enabled file is removed in
# the same change. Commenting them out in place was the alternative and was
# rejected: commented-out config rots, and someone eventually uncomments it
# without re-checking the condition that made it unsafe.


# ── RATE LIMITING ───────────────────────────────────────────────────────────
#
# Declared here because `limit_req_zone` is only valid at http level; the `limit_req`
# that uses it sits in the contact location in afc-common.conf. It stays in THIS
# file rather than moving to afc-production.conf, because a zone must be declared
# exactly once and this is the file that is always present.
#
# 10 requests per minute per IP, with a burst of 5 taken immediately. The burst is
# the number that matters, and it is sized for the CORRECTION LOOP rather than for
# a single submission — see the note beside `limit_req` in afc-common.conf, where
# a server-side 422 is shown to cost a request just as a real send does.
#
# 10m of shared memory tracks roughly 160,000 addresses, which is more than this
# site will ever need — the minimum practical size, not a considered capacity
# figure.
#
# ── $binary_remote_addr IS WRONG BEHIND CLOUDFLARE, AND THE APEX IS ────────
#
# Measured 2026-09-20: `preview.` resolves straight to the droplet, but the apex
# resolves to `2606:4700:…` — Cloudflare. So on the apex every visitor arrives as
# one of a handful of Cloudflare addresses, and a per-IP limit becomes a per-SITE
# limit shared by everyone. Five people filling in the contact form in the same
# minute would throttle each other.
#
# Not a problem today, because only `preview.` is served from here and it is not
# proxied. It MUST be fixed before the apex moves: set `real_ip_header
# CF-Connecting-IP` with `set_real_ip_from` covering Cloudflare's published
# ranges, so `$binary_remote_addr` is the visitor again. See afc-production.conf.
limit_req_zone $binary_remote_addr zone=afc_contact:10m rate=10r/m;

# ── THE PREVIEW HOST'S RENDER LIMIT ─────────────────────────────────────────
#
# Added 2026-09-29, when basic auth came off the preview host (see its server
# block). Not for secrecy — nothing there is secret — but for COST: behind auth a
# bot got a 401 that cost nginx nothing, and without it every request is a server
# render on a 1-vCPU droplet that also serves production, each making
# authenticated Sanity API calls that count against the plan's quota. And bots
# WILL come: the host's certificate is in the public Certificate Transparency
# logs, which scanners walk for hostnames.
#
# One render a second per address, sustained. The burst of 20 beside `limit_req`
# is what a person actually uses, and the preview location below says why only
# renders are counted. Preview is not behind Cloudflare, so `$binary_remote_addr`
# is the real client here, unlike on the apex.
limit_req_zone $binary_remote_addr zone=afc_preview:10m rate=1r/s;


# ── PORT 80: ACME, THEN HTTPS ───────────────────────────────────────────────
#
# `preview.` only. The apex and www keep their port-80 handling in the existing
# sites-enabled config until cutover, and picking up those names here would
# conflict with it exactly as the 443 block would.
server {
  listen 80;
  listen [::]:80;
  server_name preview.andyfitzgeraldconsulting.com;

  # Certificates are issued with `certbot certonly --webroot`, NOT `certbot --nginx`.
  # The installer plugin edits server blocks in place, which would write changes into
  # a file that is supposed to be deployed rather than edited — the exact thing the
  # repo-authored approach exists to prevent. `certonly` leaves this file alone and
  # only drops files under the webroot below.
  #
  # This location is why the bootstrap block used to obtain the first certificate
  # can be deleted: renewals land here instead.
  #
  # `^~` so this wins over the redirect regardless of what follows it.
  location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
    default_type "text/plain";
  }

  location / {
    return 301 https://$host$request_uri;
  }
}


# ── PREVIEW ─────────────────────────────────────────────────────────────────
#
# Astro's SSR build with live visual editing, proxied to a Node process that the
# `afc-preview` systemd user unit keeps running on 127.0.0.1:8081
# (web/afc-preview.service). Flipped from static on 2026-09-29: until then
# this block served a copy of the production-mode build from disk, as the
# pre-launch rehearsal. Named for the permanent job rather than the temporary one
# (Andy, 2026-09-18).
#
# ── WHAT nginx STILL DOES HERE, AND WHAT MOVED BEHIND THE PROXY ────────────
#
#   nginx   TLS, X-Robots-Tag, the render limit, the redirect map,
#           `/api/contact` to PHP, and the dotfile deny
#   Node    everything else — pages, `_astro/` with its own `immutable`, the
#           prerendered feeds and search index with their own ETags, and the
#           site's 404 (all measured on the built server, 2026-09-29)
#
# So this block includes site-common.conf and the redirects, but not the static
# tier, which now lives in afc-production.conf — see site-common.conf's header
# for why it moved there rather than into a snippet of its own.
#
# ── ITS CANONICALS NOW NAME THIS HOST, NOT THE APEX ───────────────────────
#
# The static rehearsal carried `site: https://andyfitzgeraldconsulting.com`, so
# every canonical link, JSON-LD @id, sitemap and feed URL pointed at the APEX.
# That was protective: a crawler that ignored everything below was still told the
# real copy lived elsewhere.
#
# The preview build sets `site` to THIS host (astro.config.mjs), so that backstop
# is gone. Keeping the host out of the index now rests on two guards, both saying
# `noindex, nofollow`: the X-Robots-Tag header below, which is config, and a robots
# meta the preview build writes into every page (BaseLayout), which travels with
# the HTML. Basic auth was a third until 2026-09-29, and came off because
# Presentation cannot get past it — see below.
server {
  # ── `listen … http2`, NOT the standalone `http2 on;` ──────────────────
  #
  # The droplet runs nginx 1.24.0 (Ubuntu 24.04). The standalone `http2 on;`
  # directive arrived in 1.25.1, so on 1.24 it fails outright with
  # `unknown directive "http2"` — which is how this was found: the first real
  # deploy was rejected and rolled itself back.
  #
  # The `listen` parameter form works on BOTH, and is merely deprecated (not
  # removed) on 1.25+. Switch to the standalone form only after the droplet's
  # nginx is 1.25.1 or newer, and change the pinned image in
  # validate-nginx.yml at the same time — that pin is what would have caught
  # this, and it was set to `nginx:alpine` (1.31.6) while the droplet ran 1.24.
  #
  # ── `http2` IS A SOCKET PROPERTY, NOT A SERVER-BLOCK ONE ──────────────
  #
  # Which means this line affects the OTHER sites on the droplet, and nothing
  # about reading it says so. nginx opens each listen address once, taking the
  # options from whichever block defines it FIRST — and conf.d loads before
  # sites-enabled, so this file wins. Measured 2026-09-21: all four sites sharing
  # :443 began negotiating HTTP/2 once this landed, none having asked for it.
  #
  # Harmless, for a reason worth knowing rather than assuming: every other
  # hostname here is behind Cloudflare, so browsers talk to the CDN and nginx's
  # protocol never reaches them. `preview.` is the only name resolving straight
  # to the droplet. HTTP/2 is ALPN-negotiated regardless, so HTTP/1.1 clients are
  # unaffected — verified with `curl --http1.1`.
  #
  # ── AND IT IS WHY EVERY `nginx -t` ON THE DROPLET PRINTS A WARNING ─────
  #
  #     [warn] protocol options redefined for [::]:443
  #            in /etc/nginx/sites-enabled/2024.uxmethods.org:12
  #     [warn] protocol options redefined for 0.0.0.0:443
  #            in /etc/nginx/sites-enabled/2024.uxmethods.org:13
  #     [warn] protocol options redefined for [::]:443
  #            in /etc/nginx/sites-enabled/preview.uxmethods.org:13
  #
  # Expected and harmless, not a regression to chase. THERE WERE ONE BEFORE CUTOVER
  # AND THREE AFTER, and the prediction written here beforehand — "nothing should
  # change" — was wrong. Both states were reproduced in nginx 1.24 on 2026-09-28,
  # matching the droplet line for line:
  #
  #   before  afc.conf declares `ssl http2` on :443 once. The uxmethods sites'
  #           plain `listen … ssl` lines follow silently, and only
  #           preview.uxmethods.org warns, because its `ipv6only=on` is a socket
  #           option.
  #   after   afc-production.conf adds two more `ssl http2` declarations (www and
  #           the apex). After several of them, the plain `ssl` lines in
  #           2024.uxmethods.org count as a redefinition as well.
  #
  # The earlier claim that a plain `listen 443 ssl` "inherits without a word" was
  # measured with ONE `ssl http2` ahead of it. That case is silent, and it is not
  # the droplet's case any more.
  #
  # The effective options are still the union, so every site still negotiates
  # HTTP/2 — all four uxmethods hosts answered 200 over h2 straight after the
  # cutover reload. The warnings would go away only if the uxmethods configs said
  # `http2` too; they are not this repo's to edit.
  #
  # The warnings do NOT show which conf.d file loads first. Measured both ways on
  # 1.24: the same three appear with the production file loading first or
  # second. Read the load order from the `# configuration file` lines of
  # `nginx -T`.
  #
  # Re-check if a neighboring site ever comes out from behind Cloudflare.
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name preview.andyfitzgeraldconsulting.com;

  ssl_certificate     /etc/letsencrypt/live/preview.andyfitzgeraldconsulting.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/preview.andyfitzgeraldconsulting.com/privkey.pem;
  include             /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

  # ── NO BASIC AUTH: PRESENTATION CANNOT GET PAST IT (decided 2026-09-29) ────
  #
  # Tested with the SSR flip live, from the DEPLOYED Studio, in Vivaldi in a
  # private window: Presentation's frame showed "401 Authorization Required" and
  # the browser never offered a password prompt. It will not raise an HTTP auth
  # dialog for a cross-site page inside a frame, so the frame has no way to
  # authenticate — which settles the question the history below left open.
  # Vivaldi is Chromium, so Chrome and Edge very likely behave the same; that is
  # inferred, not tested. Auth came off the same day (Andy: "nothing on preview
  # will be secret").
  #
  # With it off, the same test passed end to end, same browser: the preview
  # renders in the frame, overlays appear on hover, clicking one opens the
  # document in the Studio, an edit reloads the frame with the draft, and
  # navigating inside the preview moves the Studio's own address with it.
  #
  # What it was doing besides, and what replaced each part:
  #
  #   keeping crawlers out     X-Robots-Tag below, plus a robots meta on every
  #                            preview page (BaseLayout); both `noindex, nofollow`
  #   making bots cheap        the render limit on `location /` below — a 401 cost
  #                            nginx nothing, and an open host renders for anyone
  #
  # One thing it cannot be replaced by: drafts are now readable by anyone who
  # finds the host. Nothing sensitive belongs in a draft while that is so.
  #
  # The htpasswd file it read, /etc/nginx/afc-staging.htpasswd, was deleted by
  # hand on 2026-09-29, once this was installed; nothing references it.
  #
  # ── THE HISTORY, KEPT BECAUSE THE REASONING MOVED TWICE ────────────────────
  #
  # Removed and then restored on 2026-09-20, and the round trip is worth recording
  # because the reasoning changed rather than the conclusion.
  #
  # It came off on the grounds that nothing on the draft site is sensitive and that
  # a credential complicates Sanity's visual editing. The first is true. The second
  # turns out to be UNVERIFIED — Sanity documents the problem CLASS, shipping
  # `@sanity/vercel-protection-bypass` because Vercel's Deployment Protection
  # "prevent[s] your application from loading in the Presentation Tool preview
  # frame" — but basic auth is a different mechanism. Vercel redirects to an SSO
  # page, which is what an iframe blocks; basic auth is a native browser prompt
  # with no redirect. Nothing in the docs addresses it either way.
  #
  # ── WHICH MAKES IT AN ASYMMETRY, NOT A TRADE-OFF ──────────────────────
  #
  # Auth costs NOTHING today: staging is static and there is no Presentation
  # integration to complicate. It might cost something at the SSR flip, which is
  # months away and testable in minutes when it arrives. So it goes back on, and
  # the flip is where the question gets answered with evidence rather than with a
  # guess. If it breaks Presentation then, remove it then.
  #
  # The flip then answered it, as recorded above: it breaks Presentation.
  #
  # ── `Disallow: /` IS STILL NOT AN OPTION ──────────────────────────────
  #
  # It blocks crawling rather than indexing, so it would stop a crawler reading
  # the very header telling it to stay out. Preview's robots.txt allows everything
  # and omits the sitemap line instead (web/src/pages/robots.txt.ts).

  # ── ONCE, AT SERVER LEVEL — THE OPPOSITE OF WHAT IT USED TO BE ─────────
  #
  # Until the SSR flip this was repeated in every location of the static tier,
  # driven by an `$afc_robots` variable. nginx inherits `add_header` into a
  # location only when that location declares none of its own, and every static
  # location declared a Cache-Control — so a server-level copy would have been
  # dropped from every real page while still showing on `curl -I` for a path none
  # of them matched.
  #
  # NO LOCATION ON THIS HOST DECLARES A HEADER NOW. The proxy passes Astro's own
  # Cache-Control through rather than setting one, and the two locations in
  # site-common.conf set none. So this one line reaches every response: pages,
  # assets, 404s, the render limit's 429s, and `/api/contact`, which the
  # per-location copies never covered.
  #
  # THE TRAP IS RELOCATED, NOT GONE. Give either proxy location below an
  # `add_header` of its own and this line silently stops applying to everything
  # that location serves. deploy.sh check 3 is what catches it for pages.
  add_header X-Robots-Tag "noindex, nofollow" always;

  # ── nginx READS NO FILES FROM THIS HOST'S RELEASE ───────────────────────
  #
  # Under the static build, /var/www/afc-preview/html held `public/`, the web
  # root, and `server/`, this host's own copy of contact.php. Under SSR nginx
  # reads neither. It talks to a port, and where the Node build lives is the
  # unit's business (web/afc-preview.service, deployed by deploy-preview.yml).
  # So this block has no `root`: there is nothing it could serve.
  #
  # ── ITS CONTACT FORM RUNS PRODUCTION'S PHP (decided 2026-09-29) ──────────
  #
  # `$afc_php` names the APEX's release, so the preview release carries no PHP at
  # all: deploy-preview.yml has no PHP build, no Gmail secrets and no `.env` to
  # write, and the droplet holds one fewer copy of the Google refresh token.
  # contact.php makes no host assumptions — its redirects are relative and it
  # checks no Origin or Referer — so nothing about it changes by being reached
  # through this host. The rate-limit zone is shared as well, keyed by client
  # address, which here is the real one.
  #
  # THE COST: a branch rehearsed on preview runs `main`'s contact.php, not its
  # own, so a change to that file cannot be tried here before it ships. Giving
  # preview its own copy back is this line plus a PHP build in deploy-preview.yml.
  #
  # The variable now holds the same value on both hosts. It is kept rather than
  # inlined into site-common.conf so that the borrowing is stated HERE, in the
  # block someone reads to find out what preview does.
  set $afc_php /var/www/afc-production/html/server;

  include /etc/nginx/snippets/afc-redirects.conf;
  include /etc/nginx/snippets/afc-common.conf;

  # ── THE PROXY ───────────────────────────────────────────────────────────
  #
  # Everything site-common.conf does not claim. `/api/contact` is an exact match
  # and the dotfile deny a regex, and both win over this plain prefix whatever
  # order they appear in, so neither ever reaches Node.
  #
  # PORT 8081. Two Node apps share this droplet, and the port map is the thing
  # that stops them silently fighting — whichever bound first would win and the
  # other would fail to start, which is obvious in advance and baffling at 2am.
  #
  #     8080  preview.uxmethods.org                  uxmethods' PM2 process
  #     8081  preview.andyfitzgeraldconsulting.com   web/afc-preview.service
  #
  # A literal 127.0.0.1 rather than `localhost`, so there is nothing to resolve
  # and no `::1` to try first against a process that listens on IPv4 only.
  #
  # If the process is down, this answers 502 with nginx's own error page. That
  # is deploy.sh check 1's failure, and the reason its third interlock refuses
  # to put preview behind this proxy while nothing answers on the port.
  #
  # ── THE PROXY SETTINGS ARE SERVER-LEVEL, SO BOTH LOCATIONS SHARE THEM ──────
  #
  # Two locations proxy to the same process (see the render limit, below), and
  # these apply to both by INHERITANCE. The rule is the one X-Robots-Tag lives
  # under above, applied to a different directive: a location inherits the
  # server's `proxy_set_header` lines only if it declares none of its own. Add a
  # single `proxy_set_header` to either location and that location loses all
  # four of these, silently — measured 2026-09-29: one added to `/_astro/` alone,
  # and that location's requests arrived with `Host` reverted to the upstream's
  # address and no forwarded headers, while `/` kept all four. Add it here instead.

  # 1.1 rather than nginx's default 1.0, because Astro STREAMS its HTML in chunks
  # and HTTP/1.0 has no chunked encoding. Under 1.0 Node marks the end of a
  # response by closing the connection instead — it works, but it is the protocol
  # being worked around rather than used.
  proxy_http_version 1.1;

  # ── THE FOUR FORWARDED HEADERS, AND WHAT ASTRO DOES WITH THEM ──────────
  #
  # The standard set, so the app COULD know the real request: the public host,
  # the client's address, and that it arrived over https. What it actually does
  # with them was measured against astro 7.2.2 on 2026-09-29, and the answer is:
  # nothing yet.
  #
  # Astro trusts `Host` and `X-Forwarded-Proto` ONLY when astro.config.mjs sets
  # `security.allowedDomains`. Without that it discards both — `validateHost` and
  # `validateForwardedHeaders` in astro's core/app/validate-headers.js return
  # nothing — and `Astro.url` becomes `http://localhost:8081/…`. Checked with a
  # control: given an allowedDomains entry for this host, both headers are
  # trusted.
  #
  # It breaks nothing today because the site reads only `Astro.url.pathname`;
  # every absolute URL it emits is built from `Astro.site`. It WILL matter the
  # day something reads `Astro.url.origin`, or an on-demand route accepts a POST
  # — Astro's `checkOrigin` compares the Origin header against that origin, so a
  # same-site form would be refused as cross-site. Either one means setting
  # allowedDomains first, and then this header is what stops Astro computing
  # `http` for a request that arrived over TLS.
  proxy_set_header Host              $host;
  proxy_set_header X-Real-IP         $remote_addr;
  proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $scheme;

  # ── HASHED ASSETS: PROXIED, NOT RATE LIMITED ────────────────────────────
  #
  # Measured 2026-09-29: a cold load of an article is 14 requests to this host,
  # and 13 of them are here — CSS, scripts, font preloads, the visual-editing
  # island's chunks. Node streams these from disk; they cost next to nothing. So
  # they are not counted against the render limit, and a page load, however cold,
  # can never trip it. `^~` so no regex location is even consulted.
  location ^~ /_astro/ {
    proxy_pass http://127.0.0.1:8081;
  }

  # ── EVERYTHING ELSE: EACH REQUEST IS A SERVER RENDER ─────────────────────
  #
  # This is what a bot costs, so this is what is limited: the `afc_preview` zone
  # (declared at the top of this file) at one render a second per address, with
  # 20 taken immediately. A person clicking through pages, or Presentation
  # reloading the frame after each edit, is one render per action and never
  # comes near 20 at once. A scanner walking paths is held to one a second.
  #
  # `nodelay` answers the burst at once rather than queueing it behind the rate —
  # queued requests would hold connections open on a box with little to spare.
  # 429, unlike the contact form's deliberate 500: there is no probing signal to
  # withhold here, and a person who somehow trips it should be told plainly.
  #
  # The prerendered files (feeds, /search.json, the sitemap) come through here
  # too, and count. They are rare enough not to matter.
  location / {
    limit_req zone=afc_preview burst=20 nodelay;
    limit_req_status 429;
    proxy_pass http://127.0.0.1:8081;
  }
}
