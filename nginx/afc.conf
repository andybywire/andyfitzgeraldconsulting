# ── ANDYFITZGERALDCONSULTING.COM — SERVER BLOCKS ────────────────────────────
#
# Authored here and deployed; never edited on the server (decided 2026-08-20).
# Deploys to `/etc/nginx/conf.d/afc.conf`, which nginx includes at `http` level —
# which is required, because `limit_req_zone` below is an http-context directive.
#
# The two snippets it pulls in are the opposite: both hold server-context
# directives and must live in `snippets/`, NOT in `conf.d/`, or nginx will try to
# load them at http level and fail.
#
#   /etc/nginx/conf.d/afc.conf              this file
#   /etc/nginx/snippets/afc-common.conf     site-common.conf
#   /etc/nginx/snippets/afc-redirects.conf  redirects.conf
#
# ── BOTH HOSTS ARE WRITTEN NOW, THOUGH ONLY PREVIEW IS LIVE ────────────────
#
# The apex block is inert until DNS points at this droplet. Writing it now makes
# the cutover a DNS change plus a certificate, rather than a new file authored
# under launch pressure and tested for the first time in production.
#
# ── THE SAFETY GATE ─────────────────────────────────────────────────────────
#
# `nginx -s reload` on a bad config FAILS and leaves the running config in place.
# So: `nginx -t` first, then reload. That is what makes deploying this file safe
# enough to do from CI, and it is why rolling back is a revert plus a redeploy
# rather than an emergency SSH session.


# ── RATE LIMITING ───────────────────────────────────────────────────────────
#
# Declared here because `limit_req_zone` is only valid at http level; the `limit_req`
# that uses it sits in the contact location in afc-common.conf.
#
# 10 requests per minute per IP, with a burst of 5 taken immediately. The burst is
# the number that matters, and it is sized for the CORRECTION LOOP rather than for
# a single submission — see the note beside `limit_req` in afc-common.conf, where
# a server-side 422 is shown to cost a request just as a real send does.
#
# 10m of shared memory tracks roughly 160,000 addresses, which is more than this
# site will ever need — the minimum practical size, not a considered capacity
# figure.
#
# TUNE THIS after watching real traffic. A rate limit set once and never revisited
# is either theatre or an outage waiting for a busy day.
limit_req_zone $binary_remote_addr zone=afc_contact:10m rate=10r/m;


# ── PORT 80: ACME, THEN HTTPS ───────────────────────────────────────────────
#
# Every name on one block. It serves exactly two things: the ACME challenge, and a
# redirect.
server {
  listen 80;
  listen [::]:80;
  server_name andyfitzgeraldconsulting.com www.andyfitzgeraldconsulting.com
              preview.andyfitzgeraldconsulting.com;

  # Certificates are issued with `certbot certonly --webroot`, NOT `certbot --nginx`.
  # The installer plugin edits server blocks in place, which would write changes into
  # a file that is supposed to be deployed rather than edited — the exact thing the
  # repo-authored approach exists to prevent. `certonly` leaves this file alone and
  # only drops files under the webroot below.
  #
  # `^~` so this wins over the redirect regardless of what follows it.
  location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
    default_type "text/plain";
  }

  location / {
    return 301 https://$host$request_uri;
  }
}


# ── WWW → APEX ──────────────────────────────────────────────────────────────
#
# The live site answers on both names today, so this cannot be dropped at cutover
# without breaking links that exist in the wild. A block of its own rather than a
# rewrite inside the apex block, because the redirect is the whole job.
#
# It needs its own certificate covering the www name — one cert with both names is
# simplest (`-d andyfitzgeraldconsulting.com -d www.andyfitzgeraldconsulting.com`).
server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name www.andyfitzgeraldconsulting.com;

  ssl_certificate     /etc/letsencrypt/live/andyfitzgeraldconsulting.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/andyfitzgeraldconsulting.com/privkey.pem;
  include             /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

  return 301 https://andyfitzgeraldconsulting.com$request_uri;
}


# ── PRODUCTION ──────────────────────────────────────────────────────────────
#
# INERT UNTIL DNS MOVES. Nothing resolves here yet; the live site is still the
# 11ty build deployed by build-prod.yml.
server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name andyfitzgeraldconsulting.com;

  ssl_certificate     /etc/letsencrypt/live/andyfitzgeraldconsulting.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/andyfitzgeraldconsulting.com/privkey.pem;
  include             /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

  # ── THE RELEASE LAYOUT, WHICH THE DEPLOY WORKFLOW MUST MATCH ────────────
  #
  # A release is TWO directories, not one:
  #
  #   /var/www/afc/html -> releases/<ts>/
  #                          public/   the Astro build — this is the web root
  #                          server/   contact.php, vendor/, .env — never served
  #
  # This differs from build-prod.yml, where the release directory IS the web root
  # and mailhandler.php sits inside it. The split is what lets contact.php keep the
  # promise in its own header comment — that the `.env` beside it is somewhere
  # nginx does not serve — and it is the structural half of the fix for the live
  # site's world-readable `.env`. The permissions half belongs to the workflow.
  #
  # Both paths go through the `html` symlink so a deploy swaps them together.
  root /var/www/afc/html/public;
  set $afc_php /var/www/afc/html/server;

  # Production is indexable. The variable exists so afc-common.conf can carry one
  # `add_header` that both hosts share; empty means no header is emitted.
  set $afc_robots "";

  include /etc/nginx/snippets/afc-redirects.conf;
  include /etc/nginx/snippets/afc-common.conf;
}


# ── PREVIEW / STAGING ───────────────────────────────────────────────────────
#
# Serving the STATIC production-mode build during the pre-launch rehearsal, and
# flipping to SSR afterwards to deliver live visual editing. Named for the
# permanent job rather than the temporary one (Andy, 2026-09-18).
#
# One consequence worth stating plainly, because it looks like a bug: this build
# carries `site: https://andyfitzgeraldconsulting.com`, so its canonical links,
# JSON-LD @ids, sitemap and feed URLs all point at the APEX. That is the price of
# rehearsing the exact artifact that will ship, and it is also protective — a
# crawler that ignored everything below would still be told the canonical copy is
# elsewhere.
server {
  listen 443 ssl;
  listen [::]:443 ssl;
  http2 on;
  server_name preview.andyfitzgeraldconsulting.com;

  ssl_certificate     /etc/letsencrypt/live/preview.andyfitzgeraldconsulting.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/preview.andyfitzgeraldconsulting.com/privkey.pem;
  include             /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

  # ── KEEPING IT OUT OF THE INDEX, TWO WAYS ───────────────────────────────
  #
  # Basic auth is the real control: a crawler gets 401 and never sees a page. It is
  # what robots.txt.ts predicted phase 6 would add, and it was preferred to
  # `Disallow: /` precisely because a disallow blocks CRAWLING rather than indexing
  # — it would stop the crawler reading the very tag telling it to stay out.
  #
  # The header is the belt to that pair of braces, and it matters MORE here than it
  # would have under an SSR preview: this build runs in production mode, so
  # BaseLayout does not emit its `noindex` meta tag. Without this header there would
  # be nothing but the password.
  auth_basic           "Staging";
  auth_basic_user_file /etc/nginx/afc-staging.htpasswd;

  set $afc_robots "noindex, nofollow";

  root /var/www/afc-preview/html/public;
  set $afc_php /var/www/afc-preview/html/server;

  include /etc/nginx/snippets/afc-redirects.conf;
  include /etc/nginx/snippets/afc-common.conf;
}


# ── DELIBERATELY ABSENT ─────────────────────────────────────────────────────
#
# **HSTS.** `Strict-Transport-Security` is the obvious next header and it is left
# out on purpose: a browser that has seen it refuses plain HTTP for the whole
# max-age, and there is no way to reach that browser and tell it otherwise. That is
# a decision to make deliberately once the certificate renewal has been watched
# through a cycle or two on this droplet, not one to inherit from a config template
# during a cutover. Add it with a short max-age first.
#
# **A default_server block.** Requests arriving with an unknown Host currently fall
# to whichever block is listed first. A catch-all returning 444 would be tidier and
# is worth adding, but it interacts with certificate selection and is not
# launch-critical.
