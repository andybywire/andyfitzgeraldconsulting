# ── THE SHARED SERVER-BLOCK BODY ────────────────────────────────────────────
#
# Everything the apex and the preview host do identically: how a clean URL finds
# its file, what may be cached and for how long, and how `/api/contact` reaches
# PHP. `include`d into both content-serving blocks in afc.conf.
#
# This is a snippet, not a drop-in: it holds `location` blocks, which are valid
# only inside `server`. It must NOT be deployed into `conf.d/`, which nginx
# includes at `http` level — that would fail to load. It goes in `snippets/`.
#
# ── EACH INCLUDING BLOCK MUST SET TWO THINGS FIRST ─────────────────────────
#
#   root          the directory the Astro build was extracted into
#   $afc_php      absolute path to the directory holding contact.php and vendor/
#   $afc_robots   the X-Robots-Tag value; empty string on a host that may be indexed
#
# `$afc_php` is a variable rather than a literal because the two hosts deploy to
# different release trees. It cannot be derived from `$document_root` either: the
# PHP lives OUTSIDE the web root on purpose, so that nginx can never serve
# contact.php as source, and never serve the `.env` sitting beside it holding the
# Google client secret and refresh token.
#
# ── WHY X-Robots-Tag IS REPEATED IN EVERY LOCATION ─────────────────────────
#
# It looks like it belongs once, at server level, and that WOULD NOT WORK. nginx
# inherits `add_header` from the enclosing level only when the current level
# declares none of its own — declaring one replaces the whole inherited set rather
# than adding to it. Every location below sets `Cache-Control`, so a server-level
# `X-Robots-Tag` would be silently dropped from every response that matched one.
#
# The failure mode is the bad kind: `curl -I /` on the preview host would show the
# header (no location matched the way you expected) while every real page quietly
# lacked it. So it is repeated, driven by a variable so the two hosts still differ
# in one place. An empty `$afc_robots` emits no header at all — verified, not
# assumed, because the whole arrangement rests on it.

index index.html;

# Astro's own 404 page. `error_page` serves it for the `=404` returns below, so a
# missing URL gets the site's design rather than nginx's grey default.
error_page 404 /404.html;


# ── HTML AND EVERYTHING NOT MATCHED BELOW ───────────────────────────────────
#
# `$uri/` is what maps `/insights/domain-modeling/` onto that directory's
# index.html, and it is also what makes nginx issue its own 301 to add a missing
# trailing slash. That second behavior is load-bearing: it is the reason
# redirects.conf targets `/insights/?topic=` rather than `/insights?topic=`, since
# the latter would arrive here and take a second hop.
location / {
  try_files $uri $uri/ =404;

  # Revalidate rather than cache. `no-cache` does NOT mean "do not store" — it
  # means "store, but check before reuse" — so a repeat visitor gets a 304 and a
  # published edit is visible immediately. Anything longer would hold a stale
  # page for the length of the max-age, which on a site whose whole purpose is
  # publishing is the wrong trade.
  add_header Cache-Control "no-cache" always;
  add_header X-Robots-Tag $afc_robots always;
}


# ── CONTENT-HASHED ASSETS ───────────────────────────────────────────────────
#
# Everything Astro emits here carries a content hash in its filename, so the URL
# changes whenever the bytes do and the cache can never go stale. Fonts are
# included: since phase 2 they go through Astro's Fonts API and land in
# `_astro/fonts/` hashed, which is what retired the old warning that they could
# not take `immutable` while they shipped unhashed from `public/`.
location ^~ /_astro/ {
  add_header Cache-Control "public, max-age=31536000, immutable" always;
  add_header X-Robots-Tag $afc_robots always;
  access_log off;
  try_files $uri =404;
}


# ── THE SEARCH INDEX ────────────────────────────────────────────────────────
#
# A ROUTE, not an asset — Astro never hashes it, so `/search.json` is a stable
# filename forever. That stability was chosen deliberately (guessable and
# inspectable, which is worth something on a site that publishes a colophon), and
# it is exactly why a long `max-age` is wrong here: it would strand a visitor on a
# stale index until it expired, with no new URL to break them out of it.
#
# Revalidation instead. nginx emits `ETag` and `Last-Modified` for static files on
# its own, so `no-cache` turns the repeat visit into a single 304 rather than an
# 18.5 KB re-download. Revisit only if the index grows — a content-hashed name is
# what would make a full-text index affordable, and nothing else about that
# decision has changed.
location = /search.json {
  add_header Cache-Control "no-cache" always;
  add_header X-Robots-Tag $afc_robots always;
  try_files $uri =404;
}


# ── THE FEEDS ───────────────────────────────────────────────────────────────
#
# These are Atom, and nginx's mime.types maps `.xml` to `text/xml` — which is not
# wrong exactly, but it is not what a feed reader looks for, and it is the kind of
# thing that works in every reader you test and fails in the one you do not.
#
# Named individually rather than by a `feed*.xml` glob so that `/sitemap.xml` keeps
# its own type, and so that adding a per-taxonomy feed in phase 8 is a deliberate
# edit here rather than something that silently starts matching.
#
# `types { }` empties the type map for this location so `default_type` applies;
# that is the standard idiom, not a workaround.
location ~ ^/(feed\.xml|insights/feed(-articles|-notes)?\.xml|presentations/feed\.xml)$ {
  types { }
  default_type "application/atom+xml; charset=utf-8";
  add_header Cache-Control "no-cache" always;
  add_header X-Robots-Tag $afc_robots always;
  try_files $uri =404;
}


# ── THE CONTACT ENDPOINT ────────────────────────────────────────────────────
#
# The only path routed out of the static tree and into PHP. An exact-match
# location, so nothing else can reach the interpreter — `/api/contact/anything`
# does not match and falls through to a 404.
location = /api/contact {
  # contact.php dropped reCAPTCHA and names "a honeypot plus nginx rate limiting"
  # as what replaced it. This is that half of the bargain; without it the endpoint
  # has no volume control at all.
  #
  # burst=5, raised from 3 after measuring. A VALIDATION FAILURE IS ALSO A POST:
  # the 422 path returns field errors and the visitor corrects and resubmits, so
  # somebody fixing three fields in a row spends four requests before they have
  # sent anything. At burst=3 the limiter engaged on that fourth attempt and
  # answered with the generic failure — indistinguishable, by design, from the
  # endpoint being broken. Five leaves room for a real correction loop and is
  # still far below what makes this worth automating against.
  limit_req zone=afc_contact burst=5 nodelay;

  # 500, NOT 429, and this matters. contact.php makes every non-field failure
  # byte-identical — honeypot, injection guard, rate limit, expired token, fatal —
  # so that a spammer cannot tell which control they tripped. A 429 here would
  # hand back exactly the signal the uniform 500 exists to withhold, from the one
  # control most worth probing.
  #
  # The body still differs: nginx serves its own HTML rather than `{"ok": false}`.
  # That is invisible to the client, which does `response.json().catch(() => null)`
  # and treats any non-422, non-ok response as the generic failure.
  limit_req_status 500;

  fastcgi_pass unix:/run/php/php8.3-fpm.sock;
  include fastcgi_params;

  # SCRIPT_FILENAME is absolute and built from $afc_php rather than
  # $document_root, because the script is deliberately not under the web root.
  fastcgi_param SCRIPT_FILENAME $afc_php/contact.php;
  fastcgi_param SCRIPT_NAME /api/contact;
  fastcgi_param DOCUMENT_ROOT $afc_php;
}


# ── DOTFILES ────────────────────────────────────────────────────────────────
#
# Belt and braces. Nothing in the Astro build starts with a dot and the `.env`
# lives outside the root anyway, so this should never fire — which is the point.
# It is the rule that makes a future mistake in the deploy layout fail closed.
location ~ /\. {
  deny all;
  access_log off;
  log_not_found off;
}
