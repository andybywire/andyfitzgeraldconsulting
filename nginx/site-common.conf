# ── WHAT BOTH HOSTS SHARE ───────────────────────────────────────────────────
#
# The two locations the apex and the preview host handle identically: how
# `/api/contact` reaches PHP, and the dotfile deny. `include`d into the
# content-serving block of both afc-production.conf and afc.conf.
#
# This is a snippet, not a drop-in: it holds `location` blocks, which are valid
# only inside `server`. It must NOT be deployed into `conf.d/`, which nginx
# includes at `http` level — that would fail to load. It goes in `snippets/`.
#
# ── IT USED TO HOLD THE WHOLE STATIC TIER, AND WHY IT NO LONGER DOES ───────
#
# Until the preview host flipped to SSR (2026-09-29) this file also carried
# `try_files`, `error_page 404`, the cache tiers for `_astro/` and
# `/search.json`, and the feeds' content type. Every one of those is about
# serving files from disk, and after the flip only production does that —
# preview proxies every request to Astro's Node server, which answers them
# itself (measured: `immutable` on `_astro/`, ETags on the prerendered files, a
# real 404 for an unknown slug).
#
# So they had ONE consumer, and moved into afc-production.conf rather than into
# a new `site-static.conf` snippet. The rule is the one the CSS follows — a
# second consumer is what earns a promotion — and it runs the other way too: if
# a second host ever serves the static build again, that is when they come back
# out. What stayed here is what both hosts genuinely do the same way.
#
# ── EACH INCLUDING BLOCK MUST SET ONE THING FIRST ──────────────────────────
#
#   $afc_php   absolute path to the directory holding contact.php and vendor/
#
# A variable rather than a literal because the two hosts deploy to different
# release trees. It cannot be derived from `$document_root` either: the PHP
# lives OUTSIDE the web root on purpose, so that nginx can never serve
# contact.php as source, and never serve the `.env` sitting beside it holding
# the Google client secret and refresh token.
#
# `$afc_robots` was the second required variable, and it is gone with the static
# tier. See afc.conf for where the preview host's X-Robots-Tag now lives, and
# why it moved from per-location to per-server.
#
# ── NEITHER LOCATION SETS A HEADER, AND THAT IS LOAD-BEARING ───────────────
#
# nginx inherits `add_header` from the enclosing `server` only when a location
# declares none of its own. Neither location below does, so both pick up
# whatever the including block sets at server level — which is exactly how the
# preview host's `X-Robots-Tag` reaches them. Adding an `add_header` here would
# silently strip it from these two locations on preview.


# ── THE CONTACT ENDPOINT ────────────────────────────────────────────────────
#
# The only path routed to PHP, on both hosts. An exact-match location, so nothing
# else can reach the interpreter — `/api/contact/anything` does not match and
# falls through to whatever the host's `location /` does with it.
#
# ON THE PREVIEW HOST THIS IS WHAT KEEPS THE FORM WORKING UNDER SSR. Astro knows
# nothing of this path — the dev stub in astro.config.mjs is `apply: 'serve'` and
# absent from every build — so if the proxy's `location /` caught it, the Node
# server would answer a contact submission with its own 404. An exact match
# (`=`) beats any prefix location regardless of order, so the request reaches
# PHP-FPM without ever touching Node.
location = /api/contact {
  # contact.php dropped reCAPTCHA and names "a honeypot plus nginx rate limiting"
  # as what replaced it. This is that half of the bargain; without it the endpoint
  # has no volume control at all.
  #
  # burst=5, raised from 3 after measuring. A VALIDATION FAILURE IS ALSO A POST:
  # the 422 path returns field errors and the visitor corrects and resubmits, so
  # somebody fixing three fields in a row spends four requests before they have
  # sent anything. At burst=3 the limiter engaged on that fourth attempt and
  # answered with the generic failure — indistinguishable, by design, from the
  # endpoint being broken. Five leaves room for a real correction loop and is
  # still far below what makes this worth automating against.
  limit_req zone=afc_contact burst=5 nodelay;

  # 500, NOT 429, and this matters. contact.php makes every non-field failure
  # byte-identical — honeypot, injection guard, rate limit, expired token, fatal —
  # so that a spammer cannot tell which control they tripped. A 429 here would
  # hand back exactly the signal the uniform 500 exists to withhold, from the one
  # control most worth probing.
  #
  # The body still differs: nginx serves its own HTML rather than `{"ok": false}`.
  # That is invisible to the client, which does `response.json().catch(() => null)`
  # and treats any non-422, non-ok response as the generic failure.
  limit_req_status 500;

  fastcgi_pass unix:/run/php/php8.3-fpm.sock;
  include fastcgi_params;

  # SCRIPT_FILENAME is absolute and built from $afc_php rather than
  # $document_root, because the script is deliberately not under the web root.
  fastcgi_param SCRIPT_FILENAME $afc_php/contact.php;
  fastcgi_param SCRIPT_NAME /api/contact;
  fastcgi_param DOCUMENT_ROOT $afc_php;
}


# ── DOTFILES ────────────────────────────────────────────────────────────────
#
# Belt and braces. Nothing in the Astro build starts with a dot and the `.env`
# lives outside the root anyway, so this should never fire — which is the point.
# It is the rule that makes a future mistake in the deploy layout fail closed.
#
# It earns its place on the proxied preview host too. A regex location is checked
# after the prefix match and wins over a plain one, so a dotted path is refused
# here before the proxy's `location /` could forward it to Node — whatever the
# preview release turns out to keep beside the app, including the env file that
# holds its read token.
location ~ /\. {
  deny all;
  access_log off;
  log_not_found off;
}
