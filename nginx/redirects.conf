# ── THE 301 MAP ─────────────────────────────────────────────────────────────
#
# Every URL the 11ty site published that the Astro site does not serve at the same
# address. `include`d into BOTH server blocks — the apex and the preview host — so
# a redirect is exercised on staging exactly as it will behave in production. That
# is the whole reason the staging rehearsal exists: this file is the one part of
# the URL contract that cannot be verified locally.
#
# Inventory measured 2026-09-18 against the 2024 archive (the real live surface,
# not the templates) and `web-next/dist`, cross-checked against both datasets.
# Re-measure before trusting any count here; the corpus moves.
#
# ── WHY `rewrite` IN SERVER CONTEXT, AND NOT `map` ──────────────────────────
#
# `map` is valid only in the `http` context, so a file containing one CANNOT be
# included inside a `server` block — and being included in both blocks is this
# file's entire purpose. Two alternatives were considered and rejected:
#
#   - `map` + `if ($target) { return 301 $target; }` works, but needs a second
#     file included at http level, which splits one decision across two files and
#     two include sites.
#   - `location =` blocks match faster than regex and avoid `if`, but each one
#     must be written twice to cover the missing trailing slash, and an exact
#     location cannot express the tag catch-all at all.
#
# The cost of the shape chosen is that every request evaluates these patterns in
# order until one matches — roughly twenty PCRE evaluations on a miss. That is
# immaterial here. If this list ever grows to several dozen, wrap the tag rules in
# `location ^~ /insights/tag/` so they stop running for requests that can never
# match them.
#
# ── ORDER IS LOAD-BEARING ───────────────────────────────────────────────────
#
# `rewrite ... permanent` stops processing, so the FIRST match wins. The renamed
# tags must precede the tag catch-all. Reordering them would not error — it would
# silently send every renamed tag to a `?topic=` value the index cannot resolve,
# which renders the UNFILTERED index rather than failing. A silent wrong answer is
# exactly the failure this ordering exists to prevent, which is why the two groups
# are kept apart and labeled rather than interleaved by subject.


# ── THE JEKYLL-ERA URL SCHEME ───────────────────────────────────────────────
#
# FOUND ON THE DROPLET 2026-09-20, not in the inventory — and this is worth
# recording, because the method that missed it was otherwise a good one.
#
# The live config carries `rewrite ^/writing/(.*)/?$ /insights/$1 permanent;`.
# The redirect map here was built from the 2024 archive, which is a wget mirror of
# what the site SERVES — and `/writing/` URLs have been 301s for years, so they
# appear nowhere in it. An inventory of live pages cannot see a redirect that has
# already been honored. Only reading the old server config found it.
#
# Dropping it at cutover would have broken every inbound link minted before the
# Jekyll → 11ty move, silently and permanently.
#
# Written differently from the original in two ways. The pattern is non-greedy and
# the target carries a trailing slash, so `/writing/foo` and `/writing/foo/` both
# land on `/insights/foo/` in ONE hop; the original emitted `/insights/foo` for the
# slashless form and left nginx to add the slash with a second 301.
#
# One case still takes two hops and is left alone: a `/writing/` URL for one of the
# five re-typed documents lands on `/insights/{slug}/`, which then redirects again
# to `/presentations/…`. Collapsing that would mean duplicating five rules with a
# `/writing/` prefix to save one hop on the oldest, least-trafficked URLs the site
# has.
rewrite ^/writing/?$ /insights/ permanent;
rewrite ^/writing/(.+?)/?$ /insights/$1/ permanent;


# ── RETIRED PAGES ───────────────────────────────────────────────────────────

# `/services/` is absent from docs/urls-and-filtering.md's inventory entirely —
# found in the archive, not in the table. `/consulting/` is its successor.
rewrite ^/services(/.*)?$ /consulting/ permanent;

# The subtree is caught although the archive found no children, because a child
# that did exist would otherwise 404 and there is no address to send it to but the
# index anyway.
rewrite ^/talks(/.*)?$ /presentations/ permanent;


# ── DOCUMENTS RE-TYPED INTO THE PRESENTATION BRANCH ─────────────────────────
#
# Five articles left `/insights/` when the mis-typed interviews and talks were
# re-typed, and they landed under DIFFERENT slugs — so neither the tag rules nor
# any pattern catches them. Verified absent from `production-26` in every
# Document-branch type; without these five rules they 404.
#
# These carry external inbound links from the podcasts and meetups that hosted
# them, which is why they are mapped individually rather than swept to the index.
# Each target was matched from the article's own body text, not from title
# similarity.

# Seth Earley's podcast episode.
rewrite ^/insights/earley-ia-knowledge-graphs-and-ia/?$ /presentations/knowledge-graphs-and-ia/ permanent;

# Jorge Arango's episode — the article's text is "the transition from traditional
# web pages to a data-centric web design", which is the talk this became.
rewrite ^/insights/the-informed-life-structured-content/?$ /presentations/beyond-the-page-with-structured-content/ permanent;

# Seattle Content Strategy MeetUp, "Stop Publishing Pages!" — the body is voice,
# AI-driven agents and structured content, which is this presentation's subject.
rewrite ^/insights/cs-meetup/?$ /presentations/conversations-with-robots-voice-ai-structured-content/ permanent;

# Larry Swanson's episode. The weakest of the five matches: chosen over
# `how-to-get-started-with-knowledge-graphs` and `browsability-with-dan-brown` on
# the article's own framing — "how information architects use data, stories, and
# meaning". Revisit this one first if a mapping turns out wrong.
rewrite ^/insights/content-strategy-insights-data-stories-meaning/?$ /presentations/information-architecture-for-digital-content/ permanent;

# NOT a presentation. This is a case study ABOUT the UXMethods.org project, so it
# belongs with the project rather than with the `boutique-knowledge-graphs-…`
# TALK, which is a different artifact. `/projects/` carries `id="ux-methods"`.
#
# The `#` needs no quoting and no escape, which is worth recording because it
# looks like it should. nginx opens a comment on `#` only at a TOKEN BOUNDARY —
# mid-token it is an ordinary character, so this replacement parses intact.
# Verified with `nginx -t` against the real binary, including the negative control
# (` #comment` after whitespace, which fails). Quoting it would work too and is
# what a reader's instinct suggests; it is left off so this line matches every
# other rule. If a future edit ever does put whitespace before the `#`, nginx
# rejects the file rather than silently dropping the fragment.
rewrite ^/insights/boutique-knowledge-graph-ux-methods/?$ /projects/#ux-methods permanent;


# ── TAG URLS BECOME FILTER PARAMS ───────────────────────────────────────────
#
# The 11ty build generated one tag page PER CONCEPT rather than per concept in
# use — `web/_src/tags.njk` paginates the whole vocabulary — so the live surface
# is 67 distinct slugs from 70 concepts, not the ~30 that were ever linked.
#
# Of those 67, 36 resolve to a facet the new index accepts and 31 do not. But only
# 11 of the 31 ever had content; the other 20 were always-empty pages for concepts
# no document carried. Those 20 fall through to the catch-all below and land on
# the unfiltered index, which is the right amount of effort for a page that never
# listed anything.
#
# ── THE TARGET CARRIES A TRAILING SLASH, AND THE SPEC DID NOT ───────────────
#
# docs/urls-and-filtering.md specified `/insights?topic=$1`. That is one hop short.
# Astro builds `insights/index.html`, so `/insights` is not a served path — nginx
# answers it with a SECOND 301 to add the slash. Measured against real nginx: the
# spec form takes two hops, the form below takes one.
#
# The query string survives either way. That was worth checking rather than
# assuming, because it is the failure that would have mattered — a dropped
# `?topic=` is a silently unfiltered index, not an error.

# ── Renamed or restructured concepts, which must precede the catch-all ──

# Pluralized.
rewrite ^/insights/tag/knowledge-graph/?$ /insights/?topic=knowledge-graphs permanent;

# Shortened when the scheme was rebuilt.
rewrite ^/insights/tag/taxonomy-design/?$ /insights/?topic=taxonomy permanent;
rewrite ^/insights/tag/structured-content-design/?$ /insights/?topic=structured-content permanent;

# Narrowed — the new scheme has no bare equivalent, so each goes to the specific
# concept that absorbed it.
rewrite ^/insights/tag/modeling/?$ /insights/?topic=content-modeling permanent;
rewrite ^/insights/tag/integration/?$ /insights/?topic=technology-integration permanent;
rewrite ^/insights/tag/testing/?$ /insights/?topic=usability-testing permanent;

# `Interview` was an insight type; it is now a Genre on the PRESENTATION branch,
# so there is no `?topic=` or `?genre=` on the Insights index that reproduces it.
# The presentations index is the honest destination.
rewrite ^/insights/tag/interview/?$ /presentations/ permanent;

# DELIBERATELY ABSENT: design, discovery, strategy, systems.
#
# These four had content on the live site but are TOP CONCEPTS in the new Topic
# scheme, and content is never tagged at a top concept — so no filter state
# reproduces the old page. There is nothing to redirect them to that is more
# accurate than the unfiltered index, which is where the catch-all already puts
# them. Adding a rule would be four more lines reaching the same destination.

# ── The catch-all: all remaining tag URLs ──
#
# One rule covers the rest because the old permalink slugified prefLabel and the
# new param uses the same slugification. A slug that no longer resolves is dropped
# silently by the index and the unfiltered view renders — graceful, and recorded
# as a known consequence rather than a defect.
rewrite ^/insights/tag/(.+?)/?$ /insights/?topic=$1 permanent;


# ── DELIBERATELY NOT REDIRECTED ─────────────────────────────────────────────
#
# Recorded so their absence reads as a decision rather than an oversight.
#
# `/insights/page-2/` … `page-5/` — the four paginated index pages. Andy's call,
# 2026-09-18: no rule, they 404. Pagination is gone from the design and these were
# never ranking targets or link destinations.
#
# `/insight-search.json` — superseded by `/search.json`, which has an entirely
# different shape. A 301 would hand a stale consumer a document it cannot parse,
# which is worse than a clean 404.
#
# `/manifest.json` — the old PWA manifest. The Astro build ships none; a redirect
# would point at nothing.
#
# `www.` → apex is a whole-host concern and belongs in the server block, not here.
