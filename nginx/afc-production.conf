# ── ANDYFITZGERALDCONSULTING.COM — PRODUCTION HOST ──────────────────────────
#
# Deploys to `/etc/nginx/conf.d/afc-production.conf`, installed by nginx/deploy.sh.
#
# ITS FIRST INSTALL IS THE CUTOVER. Installed on its own, while the 11ty site is
# still enabled, it TAKES THE LIVE SITE DOWN. See the header of afc.conf for the
# measurement: `sites-available/andyfitzgeraldconsulting.com` already claims these
# two names on port 443, nginx.conf loads `conf.d/` first, and a duplicate
# server_name is a warning rather than an error — so `nginx -t` passes and the
# breakage arrives at reload.
#
# ── THE CUTOVER SEQUENCE, WHICH IS ONE CHANGE, NOT TWO ─────────────────────
#
#   1. rm /etc/nginx/sites-enabled/andyfitzgeraldconsulting.com
#   2. install this file
#   3. nginx -t
#   4. systemctl reload nginx
#
# Steps 1 and 2 must land together. Either order leaves a window: removing first
# means the apex is unserved, installing first means the conflict above. Do both,
# THEN test, THEN reload — the running config is untouched until step 4, so the
# window is zero as long as the test gates the reload.
#
# deploy.sh does all four, in that order, and a failure at 3 or 4 restores BOTH
# halves — the old link included, since without it nothing would claim the apex.
# Two interlocks stop it happening by accident: while the old link exists it
# refuses unless run with AFC_CUTOVER=yes, and it refuses outright unless a
# release exists at this file's `root` (read from this file, so the two cannot
# drift). After the first run the link is gone, both pass silently, and deploy.sh
# is an ordinary deploy again.
#
# ── ROLLBACK, WHICH IS ALSO ONE CHANGE ─────────────────────────────────────
#
# As root on the droplet, all three before the test, for the same reason:
#
#   ln -s /etc/nginx/sites-available/andyfitzgeraldconsulting.com /etc/nginx/sites-enabled/
#   rm /etc/nginx/conf.d/afc-production.conf
#   nginx -t && systemctl reload nginx
#
# The 11ty release is untouched at /var/www/afc/releases/20260814002153, so the
# old config finds exactly what it served before. afc.conf stays; preview is
# unaffected.
#
# NOT A ROLLBACK: re-running deploy.sh from an earlier commit. Those versions
# neither install nor remove this file, so it would stay in conf.d/ and keep
# winning the apex while everything reported success.
#
# TWO THINGS ROLLBACK DOES NOT UNDO:
#
#   - If `certbot reconfigure … --webroot` (below) has already run, the old port-80
#     block has no webroot location and the next renewal fails. Switch it back:
#       certbot reconfigure --cert-name andyfitzgeraldconsulting.com --nginx
#   - deploy-astro.yml keeps deploying to /var/www/afc-production. Harmless —
#     nothing serves it — but a deploy is not evidence that anything is live.
#
# ── WHAT MUST BE TRUE BEFORE THIS FILE IS INSTALLED ────────────────────────
#
#   - /var/www/afc-production/html points at a release, meaning deploy-astro.yml
#     has run from `main` at least once. NOTHING CHECKS THIS FOR YOU: `nginx -t`
#     does not look at web roots (measured, see validate-nginx.yml), so a missing
#     release validates, installs, reloads and serves 404 to everything.
#   - The apex certificate covers both names. It already does — verified
#     2026-09-20, expiring 2026-11-05 and auto-renewing.
#   - The Cloudflare real-IP ranges below are current, or the contact form's rate
#     limit throttles every visitor collectively.
#
# ── WHY PRODUCTION HAS ITS OWN BASE, NOT /var/www/afc ──────────────────────
#
# Decided 2026-09-28. The kickoff planned to reuse /var/www/afc, and the obvious
# reading of that is wrong in a way that only shows up in the ordering.
#
# The 11ty site is served from /var/www/afc/html by the OLD config, and it stays
# that way right up to the reload that retires it. If the new release shared
# that path, the first Astro deploy would swap `html` while the old config was
# still serving it. The old config (read on the droplet, 2026-09-28) has
# `root /var/www/afc/html` and a `location ~ \.php$` handler, so every page
# would break (nothing sits at the release root), `server/contact.php` would be
# reachable with no rate limit, and `server/vendor/` would be served as plain
# files. The `.env` was never at risk: that config denies `/\.(env|git|ht)`.
# Swapping the order instead means installing this file first, which serves 404
# for as long as the CI run takes.
#
# With its own base, the release lands before anything serves it, cutover is a
# single reload, and ROLLBACK IS AN NGINX REVERT: the 11ty release stays
# untouched at /var/www/afc/releases/20260814002153. It also keeps the two
# generations out of one releases/ directory, where the deploy's
# `ls -1t | tail -n +4` would have pruned 11ty releases three deploys later.
#
# /var/www/afc can be deleted once the rollback window has closed. It holds
# roughly 630 MB across three 11ty releases, so it is worth doing on a droplet
# at 80% disk, but the timing is Andy's call.
#
# ── THE CERTIFICATE'S RENEWAL MOVES TO WEBROOT AT CUTOVER ──────────────────
#
# Measured 2026-09-28: `renewal/andyfitzgeraldconsulting.com.conf` carries
# `authenticator = nginx`, from the original `certbot --nginx` issue. At every
# renewal that authenticator edits the matching server block in place, adding a
# challenge location, reloading, then reverting. Once this file is installed, the
# block it edits is here, in a file that is meant to be deployed rather than
# edited. That is exactly what afc.conf rules out for the preview certificate.
#
# So, once, AFTER this file is live (only its port-80 block serves the webroot):
#
#   certbot reconfigure --cert-name andyfitzgeraldconsulting.com \
#     --webroot -w /var/www/certbot
#
# `reconfigure` runs a dry-run renewal with the new settings before saving them,
# so a failure leaves the old settings in place. The reload a webroot renewal
# needs comes from renewal-hooks/deploy/afc-reload-nginx, installed by deploy.sh
# (see certbot-deploy-hook.sh).
#
# DONE 2026-09-28, straight after cutover. The simulated renewal inside
# `reconfigure` passed for both names — a real HTTP-01 challenge through
# Cloudflare with "Always Use HTTPS" on, which is the path the apex 443 block's
# acme location exists for. The saved conf now reads `authenticator = webroot`
# with both names mapped to /var/www/certbot. `installer = nginx` stayed; at
# renewal it only reloads, the same as the hook, so it is redundant and harmless.
# The preview certificate's dry run passed after the cutover reload too.
#
# ── THE CLOUDFLARE SETTINGS TO CONFIRM AT CUTOVER ──────────────────────────
#
# The apex is proxied through Cloudflare; `preview.` is not (measured 2026-09-21 —
# preview resolves to the droplet, every other hostname to 104.x/172.67.x). So
# this file is the first one whose traffic arrives through a CDN, and these are
# dashboard settings rather than anything in the repo. Nothing enforces them;
# this list is the only record.
#
# THE PRINCIPLE IS A THIN PROXY. Cloudflare is here to absorb load that a
# 1-vCPU/512 MB droplet running four sites cannot — not to transform anything.
# CONFIRM rather than assume, because they are toggles someone can flip years
# later. Confirmed by Andy in the dashboard on 2026-09-28, the day of cutover:
#
#   - Rocket Loader, HTML/JS/CSS minification, Email Obfuscation: ALL OFF.
#     Each rewrites HTML. That is a live hazard for this site specifically:
#     stega encodes edit links as invisible Unicode inside text, and the
#     microformats markup depends on element structure surviving intact.
#       Rocket Loader: off in the dashboard.
#       Minification: no setting could be found in the dashboard at all.
#       Email Obfuscation: its setting could not be found either, so it was
#       MEASURED BY EFFECT instead — /, /contact/ and /about/ each carry a
#       `mailto:` and came through Cloudflare with zero `email-protection`
#       rewrites. The 2024 archive has 16 such rewrites, so it HAS been on at
#       some point. That fetch is the check to repeat, because a missing
#       setting can come back.
#   - HTML not edge-cached. No Cache Rule for HTML (confirmed), and
#     afc-common.conf sends `no-cache` on HTML, which Cloudflare honors. Do not
#     add a Cache Rule that overrides it; a stale page is worse here than an
#     origin hit.
#   - SSL mode Full (strict). The origin cert is a real Let's Encrypt cert, so
#     there is no reason to run looser. IT WAS "FULL", NOT STRICT, until Andy
#     changed it on 2026-09-28. An earlier version of this list claimed strict
#     had been measured on 2026-09-21, and it had not. Checked straight after
#     the change: apex and www both 200 through Cloudflare.
#   - "Always Use HTTPS": ON. That is why the apex 443 block carries its own
#     acme-challenge location — the edge upgrades the HTTP-01 challenge to https.
#
# NOT PART OF THIS FILE, BUT IN THIS ZONE: `cms.andyfitzgeraldconsulting.com`
# is a Cloudflare redirect rule, not a site. It sends `/` to the OLD Studio
# app (nzdgq8…), and every other path returns 522 because its proxied origin
# never answers. That is a TCP failure, so it has nothing to do with the SSL
# mode. REPOINTED 2026-09-29: `/` now goes to https://afconsulting.sanity.studio.
# Deeper paths still 522, because the rule matches `/` only. A wildcard rule
# would carry them, since the new Studio keeps the path when it redirects.
#
# WORTH KNOWING: the 11ty site sends NO Cache-Control at all, so Cloudflare has
# never had anything to act on. afc-common.conf changes that — `immutable` on
# hashed _astro/ assets, `no-cache` on HTML and /search.json. Edge caching gets
# materially more useful at cutover without any dashboard change.


# ── PORT 80: ACME, THEN HTTPS ───────────────────────────────────────────────
server {
  listen 80;
  listen [::]:80;
  server_name andyfitzgeraldconsulting.com www.andyfitzgeraldconsulting.com;

  location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
    default_type "text/plain";
  }

  location / {
    return 301 https://$host$request_uri;
  }
}


# ── WWW → APEX ──────────────────────────────────────────────────────────────
#
# THIS IS A BEHAVIOR CHANGE, not a port of what is there. Today the live config
# serves BOTH names from one block, so `https://www.…` returns the site directly
# rather than redirecting. Canonicalizing on the apex is the intent — the
# canonical tags, the sitemap and the JSON-LD @ids all name the bare domain, so
# www serving a second copy of everything is the state worth ending.
#
# The certificate already covers both names, so this needs nothing new.
server {
  # `listen … http2` for nginx 1.24 — see the note in afc.conf.
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name www.andyfitzgeraldconsulting.com;

  ssl_certificate     /etc/letsencrypt/live/andyfitzgeraldconsulting.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/andyfitzgeraldconsulting.com/privkey.pem;
  include             /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

  return 301 https://andyfitzgeraldconsulting.com$request_uri;
}


# ── PRODUCTION ──────────────────────────────────────────────────────────────
server {
  # `listen … http2` for nginx 1.24 — see the note in afc.conf.
  listen 443 ssl http2;
  listen [::]:443 ssl http2;
  server_name andyfitzgeraldconsulting.com;

  ssl_certificate     /etc/letsencrypt/live/andyfitzgeraldconsulting.com/fullchain.pem;
  ssl_certificate_key /etc/letsencrypt/live/andyfitzgeraldconsulting.com/privkey.pem;
  include             /etc/letsencrypt/options-ssl-nginx.conf;
  ssl_dhparam         /etc/letsencrypt/ssl-dhparams.pem;

  # ── CLOUDFLARE SITS IN FRONT OF THIS NAME, AND THAT BREAKS RATE LIMITING ─
  #
  # Measured 2026-09-20: the apex resolves to 2606:4700:… — Cloudflare — while
  # `preview.` resolves straight to the droplet. So every request arriving here
  # comes from one of Cloudflare's addresses, and `limit_req_zone
  # $binary_remote_addr` in afc.conf would key on THAT: a per-IP limit silently
  # becomes a per-site limit that everyone shares.
  #
  # ── NOT A HYPOTHETICAL. THE LIMITER WAS MEASURED ON 2026-09-21 ───────────
  #
  # Fifteen rapid POSTs to /api/contact on the preview host, which is NOT proxied,
  # so the key was a real client address:
  #
  #     401 401 401 401 401 401 500 500 500 500 500 500 500 500 500
  #     └──── 6 through ────┘ └────────── rate limited ──────────┘
  #
  # Six — one rate slot plus burst=5 — then rejected, replenishing one per six
  # seconds. Exactly as configured, and fine for one person.
  #
  # BEHIND CLOUDFLARE THAT IS THE WHOLE SITE'S BUDGET. Six contact-form
  # submissions across all visitors, then everyone gets the generic failure until
  # slots free at one per six seconds. And because contact.php deliberately makes
  # every non-field failure byte-identical, a visitor cannot tell a rate limit
  # from a broken endpoint: they see "message not sent", retry, see it again, and
  # conclude the form does not work.
  #
  # So this block is not a tidiness item. WITHOUT IT THE CONTACT FORM IS BROKEN
  # for any two people who happen to use it in the same few minutes — on a site
  # whose stated purpose is drawing people into a professional network.
  #
  # It also means access logs record Cloudflare rather than visitors, which is the
  # more visible symptom and the one usually noticed first.
  #
  # THE RANGES BELOW MUST BE CURRENT. Cloudflare publishes them and they change.
  # A stale list does not fail loudly — it just silently stops trusting a range,
  # and those visitors go back to sharing a bucket.
  #
  # FETCHED 2026-09-28, verbatim and in published order, from
  #
  #     https://www.cloudflare.com/ips-v4    15 ranges
  #     https://www.cloudflare.com/ips-v6     7 ranges
  #
  # Those two plain-text URLs, not the HTML page at /ips/: they are what a diff
  # against this block should be run against. To re-check:
  #
  #     curl -fsS https://www.cloudflare.com/ips-v4 https://www.cloudflare.com/ips-v6
  #
  # and compare with the `set_real_ip_from` lines here. A range present there and
  # missing here is the failure that matters.
  #
  # `real_ip_header CF-Connecting-IP` is only safe BECAUSE of set_real_ip_from:
  # the header is honored only on connections from these ranges, so nobody else
  # can send it and forge their address. A request that reaches the origin
  # directly — `curl --resolve`, or anyone who knows the droplet's IP — keeps its
  # real `$remote_addr`, which is also correct.
  #
  # Kept inline rather than in a snippet: this block is its only consumer, and a
  # second consumer is what earns a promotion. Turning the proxy off for the apex
  # was the alternative the earlier TODO here named. It is not taken, because the
  # thin-proxy principle in the header is doing a job a 512 MB droplet cannot do.
  set_real_ip_from 173.245.48.0/20;
  set_real_ip_from 103.21.244.0/22;
  set_real_ip_from 103.22.200.0/22;
  set_real_ip_from 103.31.4.0/22;
  set_real_ip_from 141.101.64.0/18;
  set_real_ip_from 108.162.192.0/18;
  set_real_ip_from 190.93.240.0/20;
  set_real_ip_from 188.114.96.0/20;
  set_real_ip_from 197.234.240.0/22;
  set_real_ip_from 198.41.128.0/17;
  set_real_ip_from 162.158.0.0/15;
  set_real_ip_from 104.16.0.0/13;
  set_real_ip_from 104.24.0.0/14;
  set_real_ip_from 172.64.0.0/13;
  set_real_ip_from 131.0.72.0/22;
  set_real_ip_from 2400:cb00::/32;
  set_real_ip_from 2606:4700::/32;
  set_real_ip_from 2803:f800::/32;
  set_real_ip_from 2405:b500::/32;
  set_real_ip_from 2405:8100::/32;
  set_real_ip_from 2a06:98c0::/29;
  set_real_ip_from 2c0f:f248::/32;
  # VERIFIED LIVE 2026-09-28, after cutover. Two requests carrying a unique
  # marker went through Cloudflare (cf-ray present; the apex resolves only to
  # Cloudflare), so nginx received them from Cloudflare addresses. The access
  # log recorded both as the client's own IP, the one Cloudflare's /cdn-cgi/trace
  # reported. Only this block can make that substitution.
  #
  # NOT RUN: a same-log control, i.e. a marked request to a proxied site WITHOUT
  # real_ip, expected to log a Cloudflare address. It went to uxmethods.org and
  # did not appear in /var/log/nginx/access.log, presumably because that site
  # writes its own log. The conclusion above does not depend on it; the control
  # would only rule out a real_ip configured somewhere else as well.
  real_ip_header CF-Connecting-IP;

  # Production is indexable. The variable exists so afc-common.conf can carry one
  # `add_header` that both hosts share; empty means no header is emitted.
  set $afc_robots "";

  # ── ACME ON 443 AS WELL AS 80 ─────────────────────────────────────────────
  #
  # Let's Encrypt's HTTP-01 challenge starts on port 80, and the port-80 block
  # above answers it. But this name is proxied. If Cloudflare's "Always Use HTTPS"
  # is on, or is turned on years from now, the edge upgrades the challenge to https
  # before it reaches the droplet. Let's Encrypt follows the redirect, and the
  # request arrives HERE — where, without this location, it would fall through to
  # `try_files` and 404. Renewal would then fail quietly, and the first sign would
  # be the certificate expiring.
  #
  # So this makes renewal independent of a dashboard toggle nobody remembers is
  # connected to it. The www block needs no copy: it 301s to the apex, Let's
  # Encrypt follows that too, and the webroot plugin writes every name's token
  # into the same directory.
  #
  # `^~` so it beats the dotfile deny in afc-common.conf — `/.well-known` begins
  # with a dot. The server-level rewrites in afc-redirects.conf run BEFORE any
  # location is chosen, so they were checked too (2026-09-28): all seventeen
  # anchor on `/writing`, `/services`, `/talks` or `/insights/`, and none can
  # match this path.
  location ^~ /.well-known/acme-challenge/ {
    root /var/www/certbot;
    default_type "text/plain";
  }

  # See afc.conf for why a release is two directories, and the header for why
  # production has its own base rather than /var/www/afc.
  root /var/www/afc-production/html/public;
  set $afc_php /var/www/afc-production/html/server;

  include /etc/nginx/snippets/afc-redirects.conf;
  include /etc/nginx/snippets/afc-common.conf;
}


# ── DELIBERATELY ABSENT ─────────────────────────────────────────────────────
#
# **HSTS.** `Strict-Transport-Security` is the obvious next header and it is left
# out on purpose: a browser that has seen it refuses plain HTTP for the whole
# max-age, and there is no way to reach that browser and tell it otherwise. That is
# a decision to make deliberately once the certificate renewal has been watched
# through a cycle or two on this droplet, not one to inherit from a config template
# during a cutover. Add it with a short max-age first. Note Cloudflare can also set
# it, so check there before adding it here and doubling up.
#
# **A default_server block.** Requests arriving with an unknown Host currently fall
# to whichever block is listed first. A catch-all returning 444 would be tidier and
# is worth adding, but it interacts with certificate selection and is not
# launch-critical.
