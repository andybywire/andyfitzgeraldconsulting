name: Checks

# ── WHAT THIS CHECKS, AND WHERE ────────────────────────────────────────────
#
# Phase 8 splits the quality gates in two (Andy, 2026-10-08):
#
#   code gates   TypeGen drift, `astro check`, the Studio's `tsc`, the unit
#                tests (since 2026-11-21), Prettier. They test the repo, and no
#                content edit can change a result.
#   site gates   The link check, HTML validation, byte budgets and
#                accessibility. They test the BUILT site, and content is
#                exactly what breaks them — an author's dead link, a missing alt.
#
# On a branch this runs both, BEFORE a merge: the `code` job, and the `site` job,
# which builds the site in order to check it. On `main` it runs `code` only. The
# production build checks the site there itself, in deploy-astro.yml, against
# the build it actually ships — beside the deploy, never holding it. The account
# of that decision is in web/scripts/check-links.mjs → WHERE IT RUNS.
#
# Until 2026-10-08 this paragraph said the site gates did not belong here at
# all. They do on a branch, because nothing else builds one: without a build
# here, a template change that breaks links would first be checked after it had
# shipped.
#
# ── NO repository_dispatch ─────────────────────────────────────────────────
#
# A Sanity publish changes content and nothing else, so it cannot change a code
# gate's result. Listening for it would spend a minute per publish proving that
# again — and would put a repo-hygiene failure in the path of a content publish,
# where the author cannot fix it from the Studio.
#
# A publish CAN change a site gate's result. That is covered without this
# workflow: deploy-astro.yml rebuilds on every publish and runs the site gates
# on the build it ships.
#
# ── THE DEPLOYS DO NOT WAIT FOR THE CODE GATES ────────────────────────────
#
# Decided 2026-10-08 (Andy). A failure marks the commit red: on a branch, before
# the merge, which is where it is useful; on `main` if something gets through.
# Neither deploy-astro.yml nor deploy-preview.yml waits for it.
#
# Because none of these changes the site. A formatting slip or a stale generated
# file is a problem with the repository; holding a production deploy on one
# protects no visitor and holds up a hotfix. `astro check` is the one that CAN
# catch a defect that ships, which is why both deploys also run it themselves
# and still block on it.
#
# What that leaves open, knowingly: a merge commit is a tree no branch run has
# seen. This workflow's run on `main` still reports it — after the deploy has
# started rather than before. The alternative was for deploy-astro.yml to call
# this workflow and `needs:` it on pushes, at about a minute per push to `main`.
# Revisit if a red `main` ever ships something.
#
# ── THE CODE GATES, PROVEN 2026-10-08, ON THE RUNNER ───────────────────────
#
# A gate is not known to work until it has failed, so these were made to. Two
# runs, about a minute each:
#
#   clean tree       All four green, and TypeGen regenerated 42 queries with
#                    ZERO diff. That was the precondition for trusting the drift
#                    check at all: studio/sanity.cli.ts records two Prettier
#                    resolutions formatting identical types 827 and 901 lines
#                    long. The runner and a Mac agree.
#
#   one violation    A field added to a query without running typegen, a type
#   per gate         error in web, a type error in the Studio, a double-quoted
#                    string. All four steps failed in ONE run, each naming only
#                    its own file — which also proves they run independently.
#
# The violations were on a scratch branch, `ci-code-checks-proof`. To re-prove a
# gate after changing it, do the same: break it on purpose and watch it go red.
#
# The unit-test gate joined on 2026-11-21 and was proven red LOCALLY first: a
# deliberately broken `subtree`, then a glob that matched no file, each exiting
# 1. It is not proven on the runner until a branch push shows it red there.

# Every branch, as validate-nginx.yml does: the useful moment is before a merge.
#
# The path filter names what CANNOT affect a result, rather than what can. An
# allow-list (`web/**`, `studio/**`, the root config) fails open: the next file
# Prettier reads outside those — `.vscode/settings.json` is one today — would
# change without a run. A deny-list fails closed, since anything it does not
# name runs the checks. It names what Prettier ignores or cannot parse and no
# other step reads: Markdown, `docs/`, and `nginx/`, whose `.conf` and `.sh`
# files have their own workflow.
on:
  workflow_dispatch:
  push:
    paths:
      - "**"
      - "!**/*.md"
      - "!docs/**"
      - "!nginx/**"

# Read-only, as in the deploys; deploy-astro.yml gives the reasoning beside its
# own block. Every gate here reads the repository and reports through its exit
# code and the step summary, and neither of those needs the token.
permissions:
  contents: read

# Read-only and idempotent, so a newer push supersedes an older run freely — as
# in validate-nginx.yml, and unlike the deploys.
concurrency:
  group: code-checks-${{ github.ref }}
  cancel-in-progress: true

# The same two values the deploys set, for the same reason: astro.config.mjs
# reads them at config time, and `astro check` loads the config. Not secrets.
env:
  PUBLIC_SANITY_PROJECT_ID: 7v0qvet6
  PUBLIC_SANITY_DATASET: production-26

jobs:
  code:
    name: Types, drift, tests and formatting
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      # Pinned by commit, as in the deploys and in both of this file's jobs:
      # pnpm/action-setup is not GitHub's own. deploy-astro.yml's header has the
      # rule, and how to move a pin in every file at once.
      - name: Set up pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          # Matches `packageManager` in the root package.json, as in the deploys.
          version: 11.22.0

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            pnpm-workspace.yaml

      - name: Install dependencies
        id: install
        run: pnpm install --frozen-lockfile

      # ── EACH CHECK RUNS WHATEVER THE OTHERS DID ───────────────────────────
      #
      # Steps normally stop at the first failure, which would make a red run
      # report ONE problem and hide the rest until that one was fixed and pushed.
      # These five are independent, so each runs as long as the install
      # succeeded, and a run lists every failure at once. Gating on the install's
      # outcome rather than on `always()` is what stops a failed install from
      # producing five misleading failures of its own.
      #
      # ── EACH CHECK SAYS WHAT FAILED ───────────────────────────────────────
      #
      # Added 2026-11-25. Until then the run summary's only annotation was
      # "Process completed with exit code 1", under the JOB's name — so a red run
      # did not say which of the five checks had failed. Three Studio upgrades
      # went red that way, each on a DIFFERENT check (Studio type-check on
      # 2026-10-23, Prettier on 2026-11-13, TypeGen drift on 2026-11-25), and each
      # read from the summary as "a type error".
      #
      # So each check ends `|| { echo "::error title=…::…"; exit 1; }`. The
      # `::error::` line is a GitHub workflow command: it puts an annotation on the
      # run summary, titled with the check's name and saying how to reproduce and
      # fix it. `exit 1` keeps the step failing, which `echo` alone would not.
      # The step log still holds the detail — the diff, the file and line.
      #
      # Each message sits beside the check it explains, on purpose. Two other
      # shapes were considered and rejected:
      #
      #   one "explain" step at the end, reading `steps.<id>.outcome`
      #     Keeps the checks' commands untouched, but puts every message far from
      #     its check, where a new check's author will not see the pattern.
      #
      #   CI calling `pnpm checks` as a single step
      #     One list of checks instead of two, but the Actions UI would show one
      #     step instead of five. Per-step results are what diagnosed the
      #     2026-11-25 failure, and what the proof above is recorded against.
      #
      # So the list IS kept twice: here, and in scripts/checks.mjs, which runs the
      # same five commands locally in the same order. Change one, change both.

      # ── TYPEGEN DRIFT: KEYED ON THE DIFF, NOT ON TYPEGEN ──────────────────
      #
      # `pnpm typegen` exits 0 even when it reports errors — measured 2026-10-08,
      # while it was still warning about three files it could not parse — so its
      # status says nothing about drift. What does is whether regenerating changed
      # the committed file, and a failure prints that diff. A `-` line is a type the
      # queries no longer produce: phase 7 removed seven schema fields, and
      # sanity.types.ts declared all of them until someone ran typegen by hand. The
      # fix is `pnpm typegen` locally, then commit the result.
      #
      # It leaves the REGENERATED file in the working tree, which the next step
      # relies on.
      #
      # TypeGen ships inside the Studio's `sanity` package, so a Studio upgrade
      # upgrades the generator too — and a newer generator can write different
      # types from unchanged queries. On 2026-11-25, @sanity/codegen 8.3.0 → 8.3.4
      # began typing a field filtered by `defined()` as non-null: 48 lines of
      # drift, with no query touched. Regenerate in the upgrade's own commit.
      #
      # `pnpm typegen` gets a message of its own because a generator that crashes
      # is a different problem from a file that has drifted.
      - name: TypeGen drift
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          pnpm typegen || {
            echo "::error title=TypeGen drift::TypeGen itself failed, before any comparison. The step log has its error; pnpm typegen reproduces it."
            exit 1
          }
          git diff --exit-code web/sanity.types.ts || {
            echo "::error title=TypeGen drift::web/sanity.types.ts is not what TypeGen generates from this commit; the step log shows the diff. Run pnpm typegen and commit the file. After a Studio upgrade, suspect the generator before any query: it ships in the sanity package."
            exit 1
          }

      # Runs after the drift step, so it checks the code against types regenerated
      # from the queries as they are now, not against whatever was committed. That
      # matters on exactly the run where the two differ: stale types can hide a
      # type error — code reading a removed field type-checks against a declaration
      # that no longer describes the query. This way the step above reports the
      # stale file and this one reports what it was hiding.
      - name: astro check
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          pnpm --filter web check || {
            echo "::error title=astro check::The site has a type or template error; the step log names the file and line. pnpm --filter web check reproduces it."
            exit 1
          }

      # The Studio had no type check anywhere until this step. It covers 24 files,
      # every schema among them, in about a second — cold as well as warm, measured
      # 2026-10-08 with `--incremental false` — so it costs nothing to run here.
      #
      # The message's upgrade hint is from 2026-10-23: sanity 6.20.0 left two
      # copies of @sanity/client in the Studio's tree, and the taxonomy plugin's
      # filters stopped type-checking (fixed in e04044e). One case, so it is
      # offered as a thing to check, not as the usual cause.
      - name: Studio type-check
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          pnpm --filter studio typecheck || {
            echo "::error title=Studio type-check::The Studio has a type error; the step log names the file and line. pnpm --filter studio typecheck reproduces it. After an upgrade, check for two copies of one package (pnpm why), as with @sanity/client in e04044e."
            exit 1
          }

      # ── UNIT TESTS: node:test, EVERY PACKAGE THAT HAS A `test` SCRIPT ──────
      #
      # Added 2026-11-21 with the related-content ranker, the first shared code to
      # need tests (docs/recommendations/stream-2-ranker.md). Node's own
      # runner, so no dependency: it runs the TypeScript directly under type
      # stripping. The root script runs `test` in every package that defines one,
      # which today is web/ only.
      #
      # Two ways a test gate can pass while proving nothing, and the guard for each:
      #
      #   no tests     `node --test` exits 0 when its glob matches no file. web's
      #                script adds web/scripts/require-tests.mjs as a second
      #                reporter, which fails a run that ran nothing.
      #
      #   a hang       Node's `--test-timeout` cannot stop a synchronous infinite
      #                loop, since the loop blocks the process the timer fires in
      #                — tried, with subtree's cycle guard removed. This step's
      #                timeout is what does. The suite takes under a second, so
      #                two minutes leaves room to grow without a false alarm.
      #
      # A `.test.ts` file must never sit under web/src/pages, where Astro would
      # route it as an endpoint. The glob would still run it.
      #
      # A timeout kills the step before the message can print; GitHub annotates
      # that case itself, as "exceeded the maximum execution time".
      - name: Unit tests
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        timeout-minutes: 2
        run: |
          pnpm test || {
            echo "::error title=Unit tests::A unit test failed, or no test ran; the step log names which. pnpm test reproduces it."
            exit 1
          }

      # The whole repo, minus .prettierignore. One style repo-wide has been a
      # CLAUDE.md rule since phase 0; this is the first thing that enforces it. A
      # failure lists the files, and `pnpm format` rewrites them.
      #
      # The message names .prettierignore because the 2026-11-13 failure was a
      # generated corpus.json committed beside a Studio upgrade: a file to ignore,
      # not to reformat.
      - name: Prettier
        if: ${{ !cancelled() && steps.install.outcome == 'success' }}
        run: |
          pnpm exec prettier --check . || {
            echo "::error title=Prettier::Some files are not formatted; the step log lists them. pnpm format rewrites them. A generated file belongs in .prettierignore instead."
            exit 1
          }

  # ── THE SITE GATES, ON BRANCHES ONLY ──────────────────────────────────────
  #
  # A full production build, then the site gates against it. Skipped on `main`,
  # where deploy-astro.yml builds the same site and runs the same gates — a second
  # build here would check the same thing, later.
  #
  # Side by side with `code`, not after it, so it costs no wall-clock time: the
  # build is the slow part, and the two share nothing but the checkout.
  #
  # It builds against PUBLISHED content, as production does, so a branch can go
  # red for a link published from the Studio rather than for anything on the
  # branch. The report names the pages carrying each link, and one found on every
  # page is almost certainly in a template.
  site:
    name: Build and check the site
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
        with:
          version: 11.22.0

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            pnpm-workspace.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # For the HTML validator, which is a Java program. Pinned to 21, the version
      # used locally, rather than whatever the runner image happens to default to.
      # setup-java sets JAVA_HOME, which validate-html.mjs prefers over the PATH.
      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      # The production build exactly — the package script sets
      # PUBLIC_SITE_MODE=production — with the heap deploy-astro.yml gives it.
      - name: Build
        id: build
        env:
          NODE_OPTIONS: "--max-old-space-size=2048"
        run: pnpm --filter web build

      # Each site gate runs whatever the other did, as the code gates do: a red
      # run lists every failure at once. Gated on the BUILD, not on `always()`, so a
      # failed build does not also fail every gate, each only to say "no site".
      - name: Link check
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: pnpm links

      - name: HTML validation
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: pnpm validate

      - name: Budgets
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: pnpm budgets

      # Uses the Google Chrome the runner image preinstalls — check-a11y.mjs finds
      # it on the PATH. Nothing to set up, and nothing downloaded per run.
      - name: Accessibility
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: pnpm a11y
