name: Deploy nginx configuration

# ── WHY THIS IS A SEPARATE WORKFLOW ─────────────────────────────────────────
#
# The nginx config is authored in the repo and deployed, never edited on the
# server (decided 2026-08-20). But it must not ride along with deploy-astro.yml:
# that workflow fires on every Sanity publish, and reloading the web server
# because somebody fixed a typo in a note is both pointless and a small risk taken
# repeatedly. Separating them also gives a config change its own `nginx -t` gate
# rather than burying it inside a content build.
#
# ── THE SAFETY MODEL, WHICH IS NOT JUST `nginx -t` ─────────────────────────
#
# `nginx -s reload` on a bad config fails and leaves the RUNNING config in place.
# That is the gate this approach depends on, and on its own it is not enough —
# because it protects the running process, not the files on disk.
#
# THE STATE THAT ACTUALLY BITES: new files installed, `nginx -t` fails, so we
# never reload. The site stays up on the old config and everything looks fine —
# until certbot's renewal hook or logrotate reloads nginx hours later and the site
# goes down with no deploy anywhere near it.
#
# So every failure path RESTORES the previous files before exiting. The invariant
# is that what is on disk always equals what is running.
#
# ── SUDO IS REQUIRED, AND NARROWLY ─────────────────────────────────────────
#
# /etc/nginx is root-owned. The deploy user needs passwordless sudo for exactly
# the commands below — `install`, `mkdir`, `cp`, `nginx`, `systemctl reload nginx`.
# Grant them individually in /etc/sudoers.d/ rather than giving the account
# blanket sudo; it is the same account that receives an scp from CI.

on:
  workflow_dispatch:
  push:
    branches:
      - next
    paths:
      - "nginx/**"
      - ".github/workflows/deploy-nginx.yml"

# Two of these at once would interleave a backup with a restore and leave the
# droplet holding half of each. Never cancel a run in flight: a cancelled deploy
# is exactly the half-applied state this exists to avoid.
concurrency:
  group: nginx-deploy
  cancel-in-progress: false

jobs:
  validate:
    name: Validate the configuration
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      # Catching a syntax error here means it never reaches the droplet at all.
      # The droplet's own test and the restore path below still earn their place —
      # this runs against a stock nginx, not the one installed there — but it makes
      # the common failure free.
      #
      # Everything fabricated below is a stand-in for what the droplet supplies.
      # The CONFIG is the real file: nginx loads certificates during `-t`, so the
      # certs have to be real keys rather than empty placeholders.
      - name: nginx -t against the real config
        run: |
          set -e
          cat > /tmp/validate.sh <<'SCRIPT'
          set -e
          apk add --no-cache openssl >/dev/null 2>&1
          mkdir -p /etc/nginx/snippets /var/www/certbot
          rm -f /etc/nginx/conf.d/default.conf
          cp /repo/nginx/afc.conf         /etc/nginx/conf.d/afc.conf
          cp /repo/nginx/site-common.conf /etc/nginx/snippets/afc-common.conf
          cp /repo/nginx/redirects.conf   /etc/nginx/snippets/afc-redirects.conf

          # afc-production.conf is validated here but NOT deployed by the job
          # below — see its header. In this container there is no existing apex
          # server block, so it loads cleanly alongside afc.conf and gets the same
          # syntax checking as everything else. That is the point: the file cannot
          # be exercised on the droplet until cutover, so this is the only place it
          # is checked at all until then.
          cp /repo/nginx/afc-production.conf /etc/nginx/conf.d/afc-production.conf

          for h in andyfitzgeraldconsulting.com preview.andyfitzgeraldconsulting.com; do
            mkdir -p "/etc/letsencrypt/live/$h"
            openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
              -keyout "/etc/letsencrypt/live/$h/privkey.pem" \
              -out "/etc/letsencrypt/live/$h/fullchain.pem" \
              -subj "/CN=$h" -addext "subjectAltName=DNS:$h,DNS:www.$h" >/dev/null 2>&1
          done

          # 2048 because modern OpenSSL rejects 1024 outright — a smaller value
          # fails the test for a reason that has nothing to do with the config.
          openssl dhparam -out /etc/letsencrypt/ssl-dhparams.pem 2048 >/dev/null 2>&1

          # certbot's own file, reproduced so the `include` resolves.
          cat > /etc/letsencrypt/options-ssl-nginx.conf <<'EOF'
          ssl_session_cache shared:le_nginx_SSL:10m;
          ssl_session_timeout 1440m;
          ssl_session_tickets off;
          ssl_protocols TLSv1.2 TLSv1.3;
          ssl_prefer_server_ciphers off;
          EOF

          # The server roots are stat-ed during `-t`, so they have to exist.
          mkdir -p /var/www/afc/html/public /var/www/afc/html/server \
                   /var/www/afc-preview/html/public /var/www/afc-preview/html/server

          nginx -t
          SCRIPT
          docker run --rm -v "$PWD":/repo:ro -v /tmp/validate.sh:/validate.sh:ro \
            nginx:alpine sh /validate.sh

  deploy:
    name: Install on the droplet
    runs-on: ubuntu-latest
    needs: validate

    steps:
      - name: Check out the repository
        uses: actions/checkout@v6

      # To /tmp, which the deploy user can write. Moving the files into /etc
      # happens under sudo in the next step.
      - name: Copy the configuration to the droplet
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.AFC_HOST }}
          username: ${{ secrets.AFC_SSH_USER }}
          key: ${{ secrets.AFC_SSH_KEY }}
          port: 22
          source: "nginx/*.conf"
          target: "/tmp/afc-nginx"
          strip_components: 1

      - name: Install, test, reload — restoring on any failure
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.AFC_HOST }}
          username: ${{ secrets.AFC_SSH_USER }}
          key: ${{ secrets.AFC_SSH_KEY }}
          port: 22
          script: |
            set -e

            STAGED=/tmp/afc-nginx
            BACKUP="/tmp/afc-nginx-backup-$(date +%Y%m%d%H%M%S)"

            # The three installed paths. afc.conf goes to conf.d/ because it holds
            # `limit_req_zone`, an http-context directive; the other two hold
            # server-context directives and MUST NOT be in conf.d/, which nginx
            # includes at http level.
            #
            # afc-production.conf is DELIBERATELY NOT INSTALLED. It is scp'd to
            # /tmp along with the rest and left there. Installing it before the
            # 11ty site is retired takes the live site down — its apex block
            # collides with sites-enabled/andyfitzgeraldconsulting.com, conf.d
            # loads first, and nginx reports the collision as a warning rather than
            # an error so `nginx -t` passes. Adding it to this list is a cutover
            # step, paired with removing that sites-enabled symlink.
            CONF=/etc/nginx/conf.d/afc.conf
            COMMON=/etc/nginx/snippets/afc-common.conf
            REDIR=/etc/nginx/snippets/afc-redirects.conf

            echo ">>> Backing up the installed configuration to $BACKUP"
            mkdir -p "$BACKUP"
            # `|| true` for the first deploy, when none of these exist yet.
            for f in "$CONF" "$COMMON" "$REDIR"; do
              cp "$f" "$BACKUP/$(basename "$f")" 2>/dev/null || true
            done

            restore() {
              echo "!!! Restoring the previous configuration" >&2
              for f in "$CONF" "$COMMON" "$REDIR"; do
                b="$BACKUP/$(basename "$f")"
                if [ -f "$b" ]; then
                  sudo install -m 644 -o root -g root "$b" "$f"
                else
                  # Nothing was there before — this was a first deploy. Remove the
                  # file rather than leaving a broken one behind.
                  sudo rm -f "$f"
                fi
              done
              # Prove the restored state is loadable before walking away from it.
              if sudo nginx -t; then
                sudo systemctl reload nginx || true
                echo "!!! Restored and reloaded." >&2
              else
                echo "!!! RESTORED FILES DO NOT PASS nginx -t — MANUAL ATTENTION NEEDED" >&2
              fi
            }

            echo ">>> Installing"
            sudo mkdir -p /etc/nginx/snippets
            sudo install -m 644 -o root -g root "$STAGED/afc.conf"         "$CONF"
            sudo install -m 644 -o root -g root "$STAGED/site-common.conf" "$COMMON"
            sudo install -m 644 -o root -g root "$STAGED/redirects.conf"   "$REDIR"

            echo ">>> Testing"
            if ! sudo nginx -t; then
              restore
              exit 1
            fi

            echo ">>> Reloading"
            if ! sudo systemctl reload nginx; then
              restore
              exit 1
            fi

            # ── THE SMOKE CHECK, AND HONESTLY WHAT IT DOES NOT CATCH ──────
            #
            # A config can be perfectly valid and still wrong. MEASURED, not
            # hypothesised: deleting the semicolon after `index index.html` in
            # afc-common.conf PASSES `nginx -t` with exit 0, because `index` takes
            # multiple arguments — so the following `error_page 404 /404.html;`
            # is swallowed into its argument list. The site then serves nginx's
            # grey default 404 instead of Andy's page, and nothing anywhere
            # reports an error. Two other edits, a misspelled directive and a
            # stray brace, were both caught. A missing semicolon is the dangerous
            # one precisely because nginx's grammar tolerates it.
            #
            # So: ask the reloaded server for a page. `--resolve` to 127.0.0.1 so
            # this tests nginx rather than DNS.
            #
            # THREE ASSERTIONS, AND THE SECOND TWO EXIST BECAUSE THERE IS NO AUTH.
            # An earlier draft of this block could only check a status code, since
            # basic auth returned 401 to everything and no body was readable. Andy
            # removed the auth on 2026-09-20, which makes response bodies visible to
            # CI — so the check now covers the exact failure demonstrated above.
            echo ">>> Smoke-checking the reloaded server"
            HOST=preview.andyfitzgeraldconsulting.com

            # A function, not a `CURL="curl …"` variable. The variable form relies on
            # word splitting, which works in `sh` and silently does not in `zsh` —
            # so it cannot be exercised on a Mac before shipping. A function behaves
            # the same everywhere and can be tested where it is written.
            smoke() { curl -sk --max-time 10 --resolve "$HOST:443:127.0.0.1" "$@"; }

            # 1. The server answers at all.
            CODE=$(smoke -o /dev/null -w '%{http_code}' "https://$HOST/" || echo 000)
            case "$CODE" in
              200|301|302) echo ">>> Serving ($CODE)." ;;
              *) echo "!!! Smoke check failed — / returned '$CODE'" >&2; restore; exit 1 ;;
            esac

            # 2. A missing URL gets OUR 404 page, not nginx's.
            #
            # This is the semicolon case. Deleting the `;` after `index index.html`
            # passes `nginx -t`, because `index` accepts multiple arguments and
            # swallows the `error_page` line that follows — and the site silently
            # serves nginx's grey default. Matching on the version string nginx puts
            # in its own error pages is a negative assertion, which is deliberate:
            # it stays true regardless of what the real 404 page says.
            # THE EMPTY-BODY CASE IS CHECKED FIRST, and that is not defensive
            # padding. A `grep -q` for nginx's marker also passes on an EMPTY
            # string, so a fetch that failed outright would report success — a
            # check that goes green precisely when it cannot see anything. Caught
            # while testing this block, which is the only reason it is here.
            BODY=$(smoke "https://$HOST/__smoke_check_missing__/" || true)
            if [ -z "$BODY" ]; then
              echo "!!! 404 probe returned an empty body — the server did not answer." >&2
              restore
              exit 1
            fi
            if printf '%s' "$BODY" | grep -q '<hr><center>nginx/'; then
              echo "!!! 404s are serving nginx's default page, not the site's." >&2
              echo "!!! Usually a swallowed error_page directive — check afc-common.conf." >&2
              restore
              exit 1
            fi

            # 3. X-Robots-Tag is present on a real page.
            #
            # With basic auth gone this header is the ONLY thing keeping staging out
            # of search results, so it is worth failing a deploy over. It is also
            # easy to lose silently: nginx drops an inherited `add_header` set the
            # moment a location declares its own, so a refactor of afc-common.conf
            # can remove it from every page while `curl -I /` still looks right.
            if ! smoke -D- -o /dev/null "https://$HOST/" | grep -qi '^x-robots-tag: *noindex'; then
              echo "!!! X-Robots-Tag: noindex is MISSING from the preview host." >&2
              echo "!!! Staging is indexable. See the add_header note in afc-common.conf." >&2
              restore
              exit 1
            fi
            echo ">>> 404 page and X-Robots-Tag both correct."

            # Keep the last few backups and the staged copy for post-mortems; they
            # are plain text config files and cost nothing.
            find /tmp -maxdepth 1 -name 'afc-nginx-backup-*' -type d \
              | sort -r | tail -n +6 | xargs -r rm -rf

            echo ">>> Done."

# ── NOT HANDLED HERE, DELIBERATELY ──────────────────────────────────────────
#
# The FIRST install is manual. This workflow reloads nginx and smoke-checks a
# hostname over TLS, neither of which can work before DNS resolves and a
# certificate exists. Bootstrapping order on the droplet:
#
#   1. DNS A record for preview.andyfitzgeraldconsulting.com ✅
#   2. a minimal port-80 server block, by hand, so certbot has a webroot
#   3. certbot certonly --webroot -w /var/www/certbot -d preview...
#   4. install afc.conf + the two snippets by hand, nginx -t, reload
#
# There is no htpasswd step: basic auth was removed on 2026-09-20 (Andy's call).
# afc-production.conf is NOT part of this — see its own header.
#
# After that this workflow owns them.
#
# `certbot --nginx` is NOT the installer to use: it edits server blocks in place,
# writing changes into files that are supposed to be deployed rather than edited.
# `certonly` leaves them alone.
