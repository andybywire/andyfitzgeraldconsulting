# The whole site, since the phase 6 cutover. Until then this listed web-next and
# studio-next only, and excluded the frozen 11ty `web/` and `studio/`, which
# built from `main` with npm. Those are gone; `web` and `studio` are the Astro
# site and its Studio.
packages:
  - web
  - studio
# pnpm blocks dependency build scripts by default. esbuild's postinstall fetches its
# platform binary, so Astro cannot build without it. Each entry here is an explicit
# decision, not a blanket opt-in.
allowBuilds:
  esbuild: true
  # NOT allowed (2026-10-08). Its postinstall looks for Java 11+ and, failing that,
  # downloads a Temurin 17 runtime from GitHub into its own cache — a network fetch on
  # every install of a machine without Java, and a quieter Java version than the one
  # this repo chose. Java is supplied instead: Temurin 21 locally, setup-java in CI.
  # web/scripts/validate-html.mjs runs the jar with that `java` and never calls the
  # package's own `check()`, which would trigger the same download at run time.
  vnu-jar: false
